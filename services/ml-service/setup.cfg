[flake8]
# black owns formatting; flake8's job here is the things black cannot see.
# Duplicating black's decisions in a second tool only produces fights that end
# in someone disabling one of them.
max-line-length = 88

# E203 (whitespace before ':') and W503 (line break before binary operator) are
# emitted *by black's own output* — black is the more recent reading of PEP 8 on
# both. Leaving them on means a formatted file fails its own lint.
#
# E501 is off for the same reason and needs the longer justification: black
# already wraps everything wrappable at 88. What survives is what black
# deliberately will not split — long string literals, URLs, prose comments.
# Flagging those does not get them shortened, it gets them hand-wrapped into
# something less readable than the long line, or suffixed with noqa. The 88
# above is what black enforces; it is documented here rather than deleted so
# the intended width is still written down in one place.
extend-ignore = E203, W503, E501

exclude = .git,__pycache__,venv,.venv,models/artifacts

# E402 = "module level import not at top of file". Both cases below are
# load-order requirements, not oversights, and the code is correct as written:
#
#   main.py                calls load_dotenv() before importing the modules that
#                          read those variables at import time.
#   scripts/*, some tests  run sys.path.insert(...) to reach the service package
#                          before importing from it. That is what makes them
#                          runnable as standalone scripts.
#
# Scoped per file rather than ignored globally, so a genuinely misplaced import
# anywhere else still fails.
per-file-ignores =
    main.py:E402
    scripts/*:E402
    tests/test_autoencoder.py:E402
    tests/test_drift_monitor.py:E402
    tests/test_drift_scheduler.py:E402
    tests/test_monitoring_drift.py:E402
    tests/test_prompt_loader.py:E402
