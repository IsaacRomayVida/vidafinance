[pytest]
asyncio_mode = auto
testpaths = tests

# NOTHING IS DESELECTED ANY MORE. This suite is a full hard gate — every test
# collected under tests/ runs, and a red run means something actually broke.
#
# Keep it that way. Do NOT "fix" a failure here by adding continue-on-error, by
# re-introducing --deselect, or by ignoring a file. The two defects that once
# justified an exclusion list are both closed, and the history is kept below so
# nobody re-litigates them:
#
# This gate exists because /internal/disburse reached production publicly
# callable (#425) while its regression test sat in a suite no CI job ran. A job
# that is red from its first commit is not a gate either — it blocks every
# later merge and trains reviewers to ignore red. So the exclusions were named,
# tracked, and temporary, and they are now gone.
#
# Defect 1 (#428) — RETIRED, not fixed. The 11 tests that used to be deselected
#   here patched workers.underwriting_worker.call_decision_engine, a function
#   that was never implemented and never will be at that call site: the worker
#   they targeted is not on the live decision path (it is never started, and
#   nothing enqueues jobs for it — the real synchronous decision path is
#   functions/src/index.ts -> services/underwriting-service). Implementing
#   call_decision_engine to satisfy the tests would have built a second,
#   parallel scoring path — the exact defect shape as commit c0ce432 / P0-2,
#   where a dead second loan module priced loans at 8% while the live path
#   charged 30%. The tests were deleted, not fixed. See
#   docs/adr/ADR-004-underwriting-worker-not-the-decision-path.md.
#
# Defect 2 (#428, PR #430) — the shipped model artifact could not be loaded —
#   FIXED. It was pickled under numpy>=2.0 ("numpy._core"); requirements.txt
#   pins numpy==1.26.0 ("numpy.core" only), so loading raised
#   ModuleNotFoundError. Re-pickled by extracting the fitted weights/bias/
#   StandardScaler params as plain Python values and reconstructing the same
#   objects under the pinned numpy — no retraining. tests/test_model_parity.py
#   checks predict_proba for 24 borrower vectors against
#   tests/model_parity_baseline.json (captured from the original artifact) to
#   prove scores did not move. Its 3 tests run again as of this commit.
