<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDA Finance — Service Health Dashboard</title>
<style>
  :root { --bg: #0f1419; --card: #1a2332; --ok: #10b981; --degraded: #f59e0b; --down: #ef4444; --text: #e2e8f0; --muted: #64748b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  h1 { font-size: 24px; letter-spacing: 4px; color: #fff; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; border-left: 4px solid var(--muted); }
  .card.ok { border-left-color: var(--ok); }
  .card.degraded { border-left-color: var(--degraded); }
  .card.down { border-left-color: var(--down); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .service-name { font-weight: 600; font-size: 15px; }
  .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .status-badge.ok { background: rgba(16,185,129,0.15); color: var(--ok); }
  .status-badge.degraded { background: rgba(245,158,11,0.15); color: var(--degraded); }
  .status-badge.down { background: rgba(239,68,68,0.15); color: var(--down); }
  .status-badge.loading { background: rgba(100,116,139,0.15); color: var(--muted); }
  .deps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .dep { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); }
  .dep.true { color: var(--ok); }
  .dep.false { color: var(--down); }
  .meta { font-size: 12px; color: var(--muted); }
  .meta span { margin-right: 16px; }
  .queues { margin-top: 8px; }
  .queue-item { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .queue-item .depth { font-weight: 600; }
  .queue-item .depth.warn { color: var(--degraded); }
  .queue-item .depth.crit { color: var(--down); }
  .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .refresh-bar button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .refresh-bar button:hover { background: rgba(255,255,255,0.12); }
  #last-refresh { color: var(--muted); font-size: 12px; }
  .config { background: var(--card); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .config label { font-size: 13px; color: var(--muted); margin-right: 8px; }
  .config input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 13px; width: 300px; }
</style>
</head>
<body>

<h1>V I D A</h1>
<p class="subtitle">Service Health Dashboard</p>

<div class="config">
  <label>Base URL:</label>
  <input id="base-url" type="text" placeholder="https://vida-payment-server.railway.app" value="">
  <button onclick="refreshAll()" style="margin-left:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#e2e8f0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px">Apply</button>
</div>

<div class="refresh-bar">
  <div>
    <button onclick="refreshAll()">Refresh Now</button>
    <span id="last-refresh"></span>
  </div>
  <div>
    <label style="font-size:12px;color:#64748b">Auto-refresh:
      <select id="refresh-interval" onchange="setInterval_()" style="background:#1a2332;color:#e2e8f0;border:1px solid rgba(255,255,255,0.1);padding:2px;border-radius:4px;font-size:12px">
        <option value="0">Off</option>
        <option value="15000">15s</option>
        <option value="30000" selected>30s</option>
        <option value="60000">60s</option>
      </select>
    </label>
  </div>
</div>

<div class="grid" id="services"></div>

<script>
const SERVICES = {
  'vida-payment-server':      { port: 3001, url: '' },
  'vida-softcredito-adapter': { port: 3002, url: '' },
  'vida-notification-service': { port: 3003, url: '' },
  'vida-pdf-generator':       { port: 3004, url: '' },
  'vida-ml-service':          { port: 3005, url: '' },
};

// Try to auto-detect from known Railway patterns
const ENV_URLS = {
  'vida-payment-server': 'PAYMENT_SERVER_URL',
  'vida-softcredito-adapter': 'SOFTCREDITO_ADAPTER_URL',
  'vida-notification-service': 'NOTIFICATION_SERVICE_URL',
  'vida-pdf-generator': 'PDF_GENERATOR_URL',
  'vida-ml-service': 'ML_SERVICE_URL',
};

let refreshTimer = null;

function getServiceUrl(name) {
  const base = document.getElementById('base-url').value.replace(/\/$/, '');
  if (base) {
    // If user set a base domain pattern, derive per-service URLs
    // e.g. https://vida-payment-server.railway.app → replace service name
    if (base.includes(name)) return base;
    // Try to pattern match
    for (const svc of Object.keys(SERVICES)) {
      if (base.includes(svc)) return base.replace(svc, name);
    }
    // Fallback: localhost with port
    return `http://localhost:${SERVICES[name].port}`;
  }
  return `http://localhost:${SERVICES[name].port}`;
}

function formatUptime(sec) {
  if (!sec && sec !== 0) return '-';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function renderCard(name, data) {
  const s = data?.status || 'loading';
  const cls = ['ok','degraded','down'].includes(s) ? s : 'loading';

  // Dependencies
  let depsHtml = '';
  const depKeys = ['redis', 'firestore', 'softcredito_api', 'metamap_api', 'worker'];
  for (const k of depKeys) {
    if (data && k in data) {
      const v = data[k];
      const ok = v === true || v === 'ok' || v === 'running';
      depsHtml += `<span class="dep ${ok}">${k}: ${v}</span>`;
    }
  }

  // Queue depths
  let queueHtml = '';
  if (data?.queue_depth) {
    queueHtml = '<div class="queues">';
    for (const [q, d] of Object.entries(data.queue_depth)) {
      const cls = d > 50 ? 'crit' : d > 20 ? 'warn' : '';
      queueHtml += `<div class="queue-item"><span>${q}</span><span class="depth ${cls}">${d}</span></div>`;
    }
    queueHtml += '</div>';
  }

  return `
    <div class="card ${cls}">
      <div class="card-header">
        <span class="service-name">${name}</span>
        <span class="status-badge ${cls}">${s}</span>
      </div>
      <div class="deps">${depsHtml || '<span class="dep">—</span>'}</div>
      ${queueHtml}
      <div class="meta">
        <span>v${data?.version || '?'}</span>
        <span>uptime: ${formatUptime(data?.uptime_seconds)}</span>
        <span>${data?.ts ? new Date(data.ts).toLocaleTimeString() : ''}</span>
      </div>
    </div>
  `;
}

async function fetchHealth(name) {
  const url = getServiceUrl(name);
  try {
    const resp = await fetch(`${url}/health`, { signal: AbortSignal.timeout(8000) });
    if (!resp.ok) return { status: 'down', service: name, error: `HTTP ${resp.status}` };
    return await resp.json();
  } catch (err) {
    return { status: 'down', service: name, error: err.message };
  }
}

async function refreshAll() {
  const container = document.getElementById('services');
  const promises = Object.keys(SERVICES).map(async name => {
    const data = await fetchHealth(name);
    return { name, data };
  });

  const results = await Promise.allSettled(promises);
  let html = '';
  for (const r of results) {
    if (r.status === 'fulfilled') {
      html += renderCard(r.value.name, r.value.data);
    }
  }
  container.innerHTML = html;
  document.getElementById('last-refresh').textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;
}

function setInterval_() {
  if (refreshTimer) clearInterval(refreshTimer);
  const ms = parseInt(document.getElementById('refresh-interval').value, 10);
  if (ms > 0) refreshTimer = setInterval(refreshAll, ms);
}

// Initial load
refreshAll();
setInterval_();
</script>
</body>
</html>
