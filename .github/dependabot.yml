#
# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem and area; majors arrive as separate PRs so they get their own
# review. Security updates (CVE-driven) open immediately and ignore the weekly
# cadence. Node runtime majors are never proposed: move that line deliberately,
# in one reviewed change.
version: 2

updates:
  # npm projects, each with its own package-lock.json. One grouped PR for
  # minor/patch updates per directory; majors open on their own.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    # Stay on the current Node line: type definitions follow the runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      root-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
