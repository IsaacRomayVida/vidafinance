  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    # Only minor/patch bumps are grouped. Every major bump opens as its own PR
    # so each one is reviewed on its own; do not add semver-major here.
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # One Dockerfile per service under services/*.
  - package-ecosystem: docker
    directories:
      - "/services/*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    # Images run Node 22. Stay on the 22 line: take 22.x tag and digest
    # updates, never a new Node major. The Python image stays on 3.11 in the
    # same way until the ml-service is moved on purpose.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
