name: Sync INTERNAL_SECRET (registry-service-funpay / Railway)

# Manual-only workflow that pushes the canonical INTERNAL_SECRET into the
# registry-service-funpay Railway service (observant-miracle project), replacing
# the temporary random value Albert set at provisioning time. Until this
# runs, registry-service-funpay rejects our x-internal-secret header (401)
# and every FunTrip/Funpay shadow-write no-ops -- identical, safe, no-op
# behavior to before the Railway gate cleared, just not yet wired to the
# real thing.
#
# Uses the Railway GraphQL API directly (variableCollectionUpsert), not the
# `railway` CLI, authenticated with the account token RAILWAY_API_TOKEN
# (Bearer), which is proven to see the observant-miracle project.
#
# Why manual: same rationale as vidatravel's sync-railway-env.yml -- a
# Railway variable change redeploys the service, which would drop in-flight
# requests if run automatically on every push.
#
# When to run:
#   - Now, once, to replace the temp INTERNAL_SECRET with the real one
#   - Any time INTERNAL_SECRET rotates

on:
  workflow_dispatch: {}

concurrency:
  group: sync-registry-funpay-secret
  cancel-in-progress: false

jobs:
  sync:
    name: Push INTERNAL_SECRET → registry-service-funpay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Push variable via Railway GraphQL API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          set -euo pipefail
          # No -x / trace: INTERNAL_SECRET must never hit the job log.
          # Built with jq --arg (not string interpolation) so the secret's
          # actual bytes never need to be valid JSON on their own.
          payload=$(jq -n --arg secret "$INTERNAL_SECRET" '{
            query: "mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }",
            variables: {
              input: {
                projectId: "1ad040b4-6f0b-4530-9f58-0a1ef5e89c75",
                environmentId: "441caff4-8cc1-401f-93e2-30c49fe5d2d9",
                serviceId: "50df620b-535e-4a60-8c5e-7d71a95c60b9",
                variables: { INTERNAL_SECRET: $secret }
              }
            }
          }')

          http_status=$(curl -sS -o /tmp/railway_response.json -w '%{http_code}' \
            https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")

          if [ "$http_status" != "200" ] || grep -q '"errors"' /tmp/railway_response.json; then
            echo "::error::Railway API call failed (HTTP $http_status). Response body withheld -- may echo the variable back."
            exit 1
          fi

          if grep -q '"variableCollectionUpsert":true' /tmp/railway_response.json; then
            echo "✓ INTERNAL_SECRET pushed to registry-service-funpay (variableCollectionUpsert: true)"
          else
            echo "::error::Unexpected response shape from Railway API (HTTP 200 but no upsert:true). Response body withheld."
            exit 1
          fi
          rm -f /tmp/railway_response.json

      - name: Summary
        run: |
          {
            echo "## registry-service-funpay INTERNAL_SECRET sync complete"
            echo ""
            echo "Canonical INTERNAL_SECRET pushed to registry-service-funpay via the"
            echo "Railway API. Service will redeploy automatically. Allow ~60s before"
            echo "shadow-writes stop 401'ing."
          } >> "$GITHUB_STEP_SUMMARY"
