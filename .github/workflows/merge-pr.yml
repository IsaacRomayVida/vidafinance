name: Merge PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge'
        required: true
        type: string
      merge_method:
        description: 'Merge method'
        required: false
        default: 'squash'
        type: choice
        options:
          - squash
          - merge
          - rebase

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = parseInt('${{ inputs.pr_number }}');
            const merge_method = '${{ inputs.merge_method }}';
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            if (pr.state !== 'open') {
              console.log(`PR #${pr_number} is ${pr.state}. Skipping.`);
              return;
            }
            console.log(`Merging PR #${pr_number}: ${pr.title}`);
            const { data: result } = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              merge_method: merge_method,
              sha: pr.head.sha
            });
            console.log(`Merged: ${result.message} (${result.sha})`);
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${pr.head.ref}`
              });
              console.log(`Deleted branch: ${pr.head.ref}`);
            } catch (e) {
              console.log(`Branch cleanup: ${e.message}`);
            }
