name: Merge PR
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to merge
        required: true
        type: string
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: parseInt(context.payload.inputs.pr_number)});
            if (pr.data.state !== "open") { console.log("PR is " + pr.data.state); return; }
            const r = await github.rest.pulls.merge({owner: context.repo.owner, repo: context.repo.repo, pull_number: parseInt(context.payload.inputs.pr_number), merge_method: "squash", sha: pr.data.head.sha});
            console.log("Merged: " + r.data.sha);
            try { await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: "heads/" + pr.data.head.ref}); } catch(e) {}
