name: VIDA Platform — Deploy

on:
  push:
    branches:
      - main      # → production
      - develop   # → staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: TypeScript check (Cloud Functions)
        run: cd functions && npm run build

      - name: Run functions unit tests
        run: cd functions && npm test

  # ─────────────────────────────────────────────
  # JOB 1b: Integration Tests
  # ─────────────────────────────────────────────
  integration-test:
    name: Integration Tests (Decision Engine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root deps
        run: npm ci

      - name: Install Python deps (ml-service)
        run: |
          cd services/ml-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run JS integration tests
        run: npx jest --config tests/integration/jest.config.js
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

      - name: Run Python integration tests
        run: cd services/ml-service && python3 -m pytest ../../tests/integration/test_decision_paths.py -v
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Firebase
  # ─────────────────────────────────────────────
  deploy-firebase:
    name: Deploy Firebase (Hosting + Functions + Rules)
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push'
    # Without this the job runs to the 6h runner limit and is reported as
    # "cancelled" rather than "failed" — which raises no alert. See the
    # 2026-08-02 incident: three consecutive main deploys burned 6h each on a
    # non-retryable billing 403 and nobody was told.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            public-v2/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          UNDERWRITING_SERVICE_URL=${{ secrets.UNDERWRITING_SERVICE_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          REGISTRY_SERVICE_URL=${{ secrets.REGISTRY_SERVICE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE=${{ github.sha }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install frontend deps
        run: cd public-v2 && npm ci --legacy-peer-deps

      - name: Build frontend (public-v2)
        run: cd public-v2 && npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      # ── WHY THIS STEP EXISTS — DO NOT DELETE AS "REDUNDANT" ──────────────
      # The deploy below is a COUPLED change: rules + functions + hosting must
      # land together. But they have different prerequisites — rules/indexes/
      # storage still deploy on a project that refuses Cloud Functions writes
      # (whatever the cause: closed/suspended billing account, missing IAM, a
      # disabled API). Without this gate a push to main happily writes
      # NEW FIRESTORE RULES to production and then fails on the functions loop,
      # leaving prod enforcing new rules against the OLD frontend and the OLD
      # functions. That is exactly what broke production on 2026-08-02.
      # The per-function is_fatal() check further down aborts too LATE: by then
      # the rules are already live. This step aborts BEFORE anything deploys.
      - name: Preflight — write canary (can this project accept a deploy?)
        if: github.event_name == 'push'
        run: |
          # NOTE: `set +e` is deliberate. GitHub's default shell is `bash -e {0}`,
          # and this step inspects exit codes / HTTP statuses itself to decide
          # what is fatal vs. transient — inherited -e would abort on a merely
          # inconclusive probe, i.e. fail closed on transient noise.
          set -uo pipefail
          set +e
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          # Must match the region the functions loop below actually deploys to.
          # No setGlobalOptions()/region() anywhere in functions/src, so
          # firebase-functions uses its default region. KEEP IN SYNC.
          REGION="us-central1"
          echo "Preflight: probing whether ${PROJECT} accepts Cloud Functions writes…"

          # Reuse the credentials from "Authenticate to Google Cloud". That step
          # exports GOOGLE_APPLICATION_CREDENTIALS; gcloud may or may not have
          # the SA in its own credential store, so activate it if needed.
          # No new secrets and NO new IAM grants are required: this is the same
          # SA and the same API call `firebase deploy --only functions` makes as
          # its first write, so if it can deploy at all it can run this probe.
          TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
          if [ -z "${TOKEN:-}" ] && [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
            TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
          fi
          if [ -z "${TOKEN:-}" ]; then
            # Cannot check ≠ known-bad. Warn and let the deploy proceed; the
            # "Deploy to Firebase" step re-probes because CANARY_WRITE_OK != 1.
            echo "CANARY_WRITE_OK=0" >> "${GITHUB_ENV:-/dev/null}"
            echo "::warning::Preflight could not mint an access token; skipping the write canary (treated as transient, not fatal)."
            exit 0
          fi

          # ══ TWO PREVIOUS PROBES WERE BOTH WRONG. DO NOT GO BACK TO EITHER. ══
          #
          # DEAD PROBE 1 (PR #396) — GET .../v2/projects/$P/locations/-/functions
          #   Theory: "if we can talk to the Functions API we can deploy."
          #   FALSE: *reading* the Functions API never required an active billing
          #   account; only writes do. Run 30755911112 (main, 2026-08-02 16:11Z)
          #   returned HTTP 200 on a project that could not deploy, printed
          #   "Preflight OK", and let firestore rules + indexes + storage ship
          #   before the functions loop died. It probed the wrong verb.
          #
          # DEAD PROBE 2 (PR #397) — GET cloudbilling/v1/projects/$P/billingInfo
          #   Theory: "ask the billing API about billing."
          #   ALSO FALSE. Run 30756695646 (main, 2026-08-02 16:28Z) printed
          #   "Preflight OK: billing is enabled on <project>" — billingEnabled was
          #   genuinely true — and the very next step got HTTP 403 "Write access
          #   to project '<P>' was denied: please check billing account associated
          #   and retry" from functions:generateUploadUrl. A billing account can
          #   report as *linked* while being closed, suspended or delinquent, so
          #   billingEnabled=true does not imply writes are accepted. It probed
          #   the wrong resource.
          #
          # Both were indirect proxies for "can this project accept a deploy",
          # and both were false negatives. So stop proxying: probe the exact
          # operation that fails. functions:generateUploadUrl is the ideal
          # canary — it is the FIRST real write `firebase deploy --only
          # functions` performs, it is idempotent, and it persists nothing: it
          # just mints a short-lived signed upload URL that we throw away.
          # HTTP 200 here is positive PROOF of write capability, not an inference.
          CANARY="https://cloudfunctions.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/functions:generateUploadUrl"
          CODE=""; BODY=""
          for attempt in 1 2 3; do
            RESP="$(curl -sS -m 30 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -w $'\n%{http_code}' "$CANARY" 2>&1)"
            CODE="$(printf '%s' "$RESP" | tail -n 1)"
            BODY="$(printf '%s' "$RESP" | sed '$d')"
            # A definitive answer about write capability — stop retrying.
            case "$CODE" in
              200|401|403|404) break ;;
            esac
            # 429 / 5xx / curl timeout (000) / empty status: transient noise.
            echo "Preflight attempt ${attempt}/3: no definitive HTTP status (got '${CODE:-none}'); retrying…"
            sleep $((attempt * 5))
          done

          # ABORTS THE DEPLOY (fail closed) — HTTP 403 on the write canary.
          # This is the only fatal branch, and it is unambiguous: the project
          # refused the first write the deploy makes, so the functions loop
          # cannot possibly succeed. Deliberately NOT conditioned on the body
          # naming billing — a 403 from missing cloudfunctions write IAM is
          # equally undeployable, and body-matching is how probe 2 got fooled.
          if [ "$CODE" = "403" ]; then
            echo "::error::DEPLOY ABORTED BEFORE ANY CHANGE WAS APPLIED — project ${PROJECT} refused a Cloud Functions write (HTTP 403)."
            echo ""
            echo "=================================================================="
            echo " PROJECT REJECTS CLOUD FUNCTIONS WRITES: ${PROJECT}"
            echo ""
            echo " Measured directly: POST functions:generateUploadUrl returned 403."
            echo " That is the first write a functions deploy performs, so this"
            echo " deploy cannot succeed. Note this says nothing about whether the"
            echo " billing API reports billing as enabled — it did report enabled"
            echo " on run 30756695646 while writes were being denied. A linked"
            echo " billing account can still be closed, suspended or delinquent."
            echo " The other cause of a 403 here is the deploy service account"
            echo " lacking Cloud Functions write permission."
            echo ""
            echo " Cloud Functions cannot deploy in this state, but Firestore"
            echo " rules CAN — so continuing would push new rules to production and"
            echo " leave them enforcing against the OLD functions and OLD frontend."
            echo " Aborting BEFORE any deploy so production is not left half-updated."
            echo ""
            echo " FIX: check the linked billing account (closed/suspended/past due)"
            echo " and the deploy service account's roles, then re-run this job:"
            echo "   https://console.cloud.google.com/billing/linkedaccount?project=${PROJECT}"
            echo "=================================================================="
            echo ""
            echo "Full canary response (HTTP ${CODE}):"
            printf '%s\n' "$BODY"
            exit 1
          fi

          # DOES NOT ABORT (fail open): 401, 404, 429, 5xx, curl timeouts and
          # empty/garbage statuses. None of those prove the project is
          # undeployable, and failing closed on them would wedge every deploy on
          # transient noise. 401 in particular is a credential problem — the real
          # deploy will fail loudly and correctly on its own. This gate exists
          # only to stop the *half*-applied case, not to be a second deploy.
          if [ "$CODE" = "200" ]; then
            echo "CANARY_WRITE_OK=1" >> "${GITHUB_ENV:-/dev/null}"
            echo "Preflight OK: ${PROJECT} accepted a Cloud Functions write probe (HTTP 200); proceeding with deploy."
          else
            echo "CANARY_WRITE_OK=0" >> "${GITHUB_ENV:-/dev/null}"
            echo "::warning::Preflight write canary inconclusive (HTTP ${CODE:-none}). Proceeding; the deploy step re-probes once before applying anything."
            printf '%s\n' "$BODY" | head -n 20
          fi

      - name: Deploy to Firebase
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          REGION="us-central1"   # KEEP IN SYNC with the preflight canary above
          echo "Deploying to $PROJECT"

          # ── 0) LAST-CHANCE WRITE CANARY — nothing above this line has mutated
          #    anything, and nothing below may run until this passes.
          #
          #    Why this exists even though the preflight step already ran: that
          #    step fails OPEN on transient noise (401/429/5xx/timeout), by
          #    design, so a deploy CAN reach this point with no positive proof of
          #    write capability — which is exactly the state that produces the
          #    half-applied production we are trying to prevent. It also closes
          #    the (small) race between the preflight step and this one. So the
          #    rules/indexes/storage deploy below is gated on a canary that
          #    returned 200, in every path.
          #
          #    ATOMICITY DISCLAIMER — READ BEFORE TRUSTING THIS: this is
          #    best-effort ordering, NOT a transaction. It guarantees that
          #    NOTHING is applied when the project is known to refuse writes. It
          #    does NOT guarantee all-or-nothing: if the functions loop below
          #    fails MIDWAY for an unrelated reason (CPU quota, a bad build, a
          #    trigger-type change), rules and indexes are already live against a
          #    partially-updated backend. That residual window is real,
          #    out of scope here, and deliberately named rather than papered over.
          if [ "${CANARY_WRITE_OK:-0}" = "1" ]; then
            echo "Write canary already confirmed in preflight (HTTP 200); proceeding."
          else
            echo "Preflight canary did not confirm write access; re-probing once before applying anything…"
            set +e
            TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
            RESP="$(curl -sS -m 30 -X POST \
              -H "Authorization: Bearer ${TOKEN:-}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -w $'\n%{http_code}' \
              "https://cloudfunctions.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/functions:generateUploadUrl" 2>&1)"
            set -e
            CODE="$(printf '%s' "$RESP" | tail -n 1)"
            if [ "$CODE" = "403" ]; then
              echo "::error::DEPLOY ABORTED BEFORE ANY CHANGE WAS APPLIED — project ${PROJECT} refused a Cloud Functions write (HTTP 403). No rules, indexes, storage, functions or hosting were touched. Check the linked billing account (it can report as enabled while closed/suspended/delinquent) and the deploy service account's Cloud Functions permissions: https://console.cloud.google.com/billing/linkedaccount?project=${PROJECT}"
              printf '%s\n' "$RESP" | sed '$d'
              exit 1
            elif [ "$CODE" = "200" ]; then
              echo "Re-probe OK: ${PROJECT} accepted a Cloud Functions write (HTTP 200)."
            else
              echo "::warning::Re-probe still inconclusive (HTTP ${CODE:-none}); proceeding — see the atomicity disclaimer above."
            fi
          fi

          # 1) Rules, indexes and storage first — these are backward-compatible
          #    and must be in place before the functions that rely on them.
          #    They run ONLY after a canary returned 200 (or was inconclusive and
          #    explicitly logged as such); a 403 exits above, untouched.
          #    HOSTING IS DEPLOYED LAST, in a separate step, and ONLY if every
          #    function deployed. Releasing hosting before functions is what
          #    broke production on 2026-08-02: the new frontend went live
          #    calling `getLoanConfig`, the functions deploy then failed on a
          #    billing 403, and the loan wizard fail-closed for every borrower
          #    against a callable that had never been deployed.
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project "$PROJECT" --non-interactive

          # 2) Functions ONE AT A TIME. Changing shared env (e.g. a secret)
          #    forces a new Cloud Run revision for EVERY gen2 function; each new
          #    revision holds ~1 CPU during its health-check. The project's
          #    "total allowable CPU per project per region" quota is low and
          #    cannot be raised, so we deploy a single function at a time and let
          #    its instance scale back to zero before the next one. Retries with
          #    backoff absorb any leftover warm instances still occupying CPU.
          #    Functions are ordered service-callers FIRST so the INTERNAL_SECRET
          #    auth path (requestLoan / onLoanApproved / generatePaymentLink …) is
          #    fixed early even if later, non-critical functions need a re-run.
          #    KEEP IN SYNC with the exported functions in functions/src/index.ts.
          FUNCTIONS="
            requestLoan getLoanConfig onLoanApproved generatePaymentLink markLoanDisbursed
            metamapWebhook getSystemHealth systemHealthCheck queueHealthCheck
            processPayroll satBlacklistRefresh refreshSatBlacklists
            api checkEmailAvailability validateCURP updateLoanStatus
            approveEmployer getPortfolioReport getAdminDashboard getEmployerDashboard
            submitReviewDecision getReviewDetail getReviewQueue updateEmployerTier setEmployerClaims
            updateEmployerCurpConfig getContractDownloadUrl setAdminClaim revokeAdminClaim
            sendVerificationEmail sendEmployeeInvite lookupInvite acceptInvite
            lookupEmployerByCode
            onContactCreated onEmployerDocCreated onLoanStatusChange onEmployeeDocCreated
            autoVerifyOnEmployerCreate autoVerifyOnEmployeeCreate dailyLoanCheck
            weeklyPortfolioSnapshot
          "

          # Account-level failures (billing disabled, write access denied, API
          # turned off) are deterministic: they will fail identically on every
          # function and every attempt. Retrying them 4x across ~40 functions
          # costs ~6h and buries the real cause under 256 identical errors.
          # Detect them and abort the whole deploy at the first occurrence.
          FATAL=0
          is_fatal() {
            printf '%s' "$1" | grep -qiE \
              "please check billing account|billing account .*(disabled|closed|not (found|active))|Write access to project .* was denied|billing (is )?(not enabled|disabled)|SERVICE_DISABLED|PERMISSION_DENIED.*(billing|serviceusage)"
          }

          deploy_one() {
            local fn="$1" attempt out rc
            for attempt in 1 2 3 4; do
              echo "::group::Deploy ${fn} (attempt ${attempt}/4)"
              set +e
              out="$(firebase deploy --only "functions:${fn}" --project "$PROJECT" --non-interactive --force 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$out"
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if is_fatal "$out"; then
                echo "::error::${fn}: non-retryable account-level failure (billing or project permissions), not a transient CPU-quota backoff. Aborting the deploy now instead of retrying ~40 functions into the 6h job limit."
                FATAL=1
                return 1
              fi
              echo "  ${fn} failed (attempt ${attempt}); backing off so CPU can free up…"
              sleep $((attempt * 60))
            done
            return 1
          }

          total=0; for fn in $FUNCTIONS; do total=$((total+1)); done
          idx=0; ok=0; FAILED=""
          for fn in $FUNCTIONS; do
            idx=$((idx+1))
            echo "=== [${idx}/${total}] ${fn} ==="
            if deploy_one "$fn"; then
              ok=$((ok+1))
            else
              FAILED="${FAILED} ${fn}"
              if [ "$FATAL" = "1" ]; then
                echo "::error::Aborting after a non-retryable failure on ${fn}. Deployed ${ok}/${total} before the abort; hosting will NOT be released."
                break
              fi
              echo "::warning::${fn} did not deploy after retries"
            fi
            # brief settle so the new revision can scale to zero before the next
            if [ "$idx" -lt "$total" ]; then sleep 30; fi
          done

          echo "Deployed ${ok}/${total} functions."
          if [ "$FATAL" = "1" ]; then
            echo "::error::Deploy aborted: the Google Cloud project rejected function writes (billing or project permissions). Hosting was deliberately left on the previous release so production is not left running a frontend against undeployed backend code. Fix the account issue, then re-run this job."
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Functions that failed after retries:${FAILED}"
            echo "Re-run this job to retry TRANSIENT failures (e.g. CPU-quota backoff) — already-deployed functions are skipped, so those converge."
            echo "EXCEPTION: a trigger-type change (e.g. HTTPS -> Firestore/other event trigger) never converges via re-run, no matter how many times."
            echo "Firebase refuses to change a deployed function's trigger type in place; check the per-function error above for"
            echo "'is not allowed. Please delete your function and create a new one instead.' -- if present, re-running just wastes another cycle."
            echo "That function must be deleted first (firebase functions:delete <name> --region <region> --project <id>), then the next deploy recreates it."
            exit 1
          fi
          echo "All ${total} functions deployed successfully."

      # Hosting goes LAST and only on a fully successful functions deploy, so a
      # backend failure can never leave production serving a frontend that calls
      # callables which were never deployed.
      - name: Deploy Hosting (only after all functions succeeded)
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          echo "Releasing hosting to $PROJECT"
          firebase deploy --only hosting --project "$PROJECT" --non-interactive

