name: VIDA Platform — Deploy

on:
  push:
    branches:
      - main      # → production
      - develop   # → staging
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1a: Lint & Typecheck (parallel with test)
  # ─────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Install notification-service deps
        run: cd services/notification-service && npm ci

      - name: Install softcredito-adapter deps
        run: cd services/softcredito-adapter && npm ci

      - name: ESLint — functions
        run: cd functions && npm run lint

      - name: ESLint — notification-service
        run: cd services/notification-service && npm run lint

      - name: ESLint — softcredito-adapter
        run: cd services/softcredito-adapter && npm run lint

      - name: TypeScript typecheck — functions
        run: cd functions && npm run typecheck

      - name: TypeScript typecheck — notification-service
        run: cd services/notification-service && npm run typecheck

      - name: TypeScript typecheck — softcredito-adapter
        run: cd services/softcredito-adapter && npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint — ml-service (best-effort)
        continue-on-error: true
        run: |
          pip install flake8
          cd services/ml-service && flake8 --max-line-length 120 --exclude __pycache__,models/*.joblib .

  # ─────────────────────────────────────────────
  # JOB 1b: Unit Tests (parallel with lint)
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Cloud Functions unit tests
        run: cd functions && npm run test:ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ml-service deps
        run: pip install -r services/ml-service/requirements.txt

      - name: ml-service unit tests
        continue-on-error: true
        run: cd services/ml-service && python -m pytest tests/ -v

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to Staging
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase to Staging
        run: |
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project vida-finance \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Railway services to Staging
        continue-on-error: true
        run: |
          for service in vida-payment-server vida-softcredito vida-notifications vida-pdf-generator vida-ml-service; do
            echo "🚀 Deploying $service to staging..."
            railway redeploy --service "$service" --yes || \
              echo "⚠️  railway redeploy skipped for $service"
          done
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

  # ─────────────────────────────────────────────
  # JOB 3: Integration / Smoke Tests
  # ─────────────────────────────────────────────
  integration-test:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Smoke test — staging health checks
        run: |
          check_health() {
            local url="$1"
            local service="$2"
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "✅ $service — healthy (HTTP $status)"
                return 0
              fi
              echo "  attempt $attempt/$max_attempts: $service returned $status, retrying in 15s..."
              sleep 15
              attempt=$((attempt + 1))
            done
            echo "❌ $service — not healthy after $max_attempts attempts (last: $status)"
            return 1
          }

          FAILED=0
          check_health "https://vida-payment-server-staging.railway.app/health"  "payment-server"   || FAILED=1
          check_health "https://vida-softcredito-staging.railway.app/health"     "softcredito"       || FAILED=1
          check_health "https://vida-notifications-staging.railway.app/health"   "notifications"     || FAILED=1
          check_health "https://vida-pdf-generator-staging.railway.app/health"   "pdf-generator"     || FAILED=1
          check_health "https://vida-ml-service-staging.railway.app/health"      "ml-service"        || FAILED=1

          if [ $FAILED -ne 0 ]; then
            echo "🚨 One or more staging services failed health checks"
            exit 1
          fi
          echo "✅ All staging services healthy"

      - name: Notify Slack — staging deployed
        if: success()
        continue-on-error: true
        run: |
          [ -n "$SLACK_URL" ] && curl -X POST "$SLACK_URL" \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ VIDA Staging deploy succeeded — all services healthy"}' || true
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─────────────────────────────────────────────
  # JOB 4: Deploy to Production (manual gate)
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase to Production
        run: |
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project vida-finance \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Railway services to Production
        continue-on-error: true
        run: |
          for service in vida-payment-server vida-softcredito vida-notifications vida-pdf-generator vida-ml-service; do
            echo "🚀 Deploying $service to production..."
            railway redeploy --service "$service" --yes || \
              echo "⚠️  railway redeploy skipped for $service"
          done
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 5: Post-Deploy Health Check (Production)
  # ─────────────────────────────────────────────
  health-check:
    name: Production Health Checks
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health check all Railway services
        run: |
          check_health() {
            local url="$1"
            local service="$2"
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "✅ $service — healthy (HTTP $status)"
                return 0
              fi
              echo "  attempt $attempt/$max_attempts: $service returned $status, retrying in 15s..."
              sleep 15
              attempt=$((attempt + 1))
            done
            echo "❌ $service — not healthy after $max_attempts attempts (last: $status)"
            return 1
          }
          check_health "https://vida-payment-server.railway.app/health"  "payment-server"
          check_health "https://vida-softcredito.railway.app/health"     "softcredito-adapter"
          check_health "https://vida-notifications.railway.app/health"   "notification-service"
          check_health "https://vida-pdf-generator.railway.app/health"   "pdf-generator"
          check_health "https://vida-ml-service.railway.app/health"      "ml-service"

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        run: |
          [ -n "$SLACK_URL" ] && curl -X POST "$SLACK_URL" \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ VIDA Deploy to *production* succeeded — all services healthy"}' || true
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        run: |
          [ -n "$SLACK_URL" ] && curl -X POST "$SLACK_URL" \
            -H 'Content-type: application/json' \
            --data '{"text":"🚨 VIDA Deploy to *production* FAILED — check GitHub Actions"}' || true
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
