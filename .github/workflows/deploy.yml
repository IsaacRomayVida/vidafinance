name: VIDA Platform — Deploy

on:
  push:
    branches:
      - main      # → production
      - develop   # → staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: TypeScript check (Cloud Functions)
        run: cd functions && npm run build

      - name: Run functions unit tests
        run: cd functions && npm test

  # ─────────────────────────────────────────────
  # JOB 1b: Integration Tests
  # ─────────────────────────────────────────────
  integration-test:
    name: Integration Tests (Decision Engine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root deps
        run: npm ci

      - name: Install Python deps (ml-service)
        run: |
          cd services/ml-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run JS integration tests
        run: npx jest --config tests/integration/jest.config.js
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

      - name: Run Python integration tests
        run: cd services/ml-service && python3 -m pytest ../../tests/integration/test_decision_paths.py -v
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Firebase
  # ─────────────────────────────────────────────
  deploy-firebase:
    name: Deploy Firebase (Hosting + Functions + Rules)
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push'
    # Without this the job runs to the 6h runner limit and is reported as
    # "cancelled" rather than "failed" — which raises no alert. See the
    # 2026-08-02 incident: three consecutive main deploys burned 6h each on a
    # non-retryable billing 403 and nobody was told.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            public-v2/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          UNDERWRITING_SERVICE_URL=${{ secrets.UNDERWRITING_SERVICE_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          REGISTRY_SERVICE_URL=${{ secrets.REGISTRY_SERVICE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE=${{ github.sha }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install frontend deps
        run: cd public-v2 && npm ci --legacy-peer-deps

      - name: Build frontend (public-v2)
        run: cd public-v2 && npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      # ── WHY THIS STEP EXISTS — DO NOT DELETE AS "REDUNDANT" ──────────────
      # The deploy below is a COUPLED change: rules + functions + hosting must
      # land together. But they have different prerequisites — rules/indexes/
      # storage deploy fine with billing OFF, while Cloud Functions require an
      # active billing account. Without this gate a push to main happily writes
      # NEW FIRESTORE RULES to production and then fails on the functions loop,
      # leaving prod enforcing new rules against the OLD frontend and the OLD
      # functions. That is exactly what broke production on 2026-08-02.
      # The per-function is_fatal() check further down aborts too LATE: by then
      # the rules are already live. This step aborts BEFORE anything deploys.
      - name: Preflight — project can accept a full deploy (billing gate)
        if: github.event_name == 'push'
        run: |
          # NOTE: `set +e` is deliberate. GitHub's default shell is `bash -e {0}`,
          # and this step inspects exit codes / HTTP statuses itself to decide
          # what is fatal vs. transient — inherited -e would abort on a merely
          # inconclusive probe, i.e. fail closed on transient noise.
          set -uo pipefail
          set +e
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          echo "Preflight: checking the billing state of $PROJECT…"

          # Reuse the credentials from "Authenticate to Google Cloud". That step
          # exports GOOGLE_APPLICATION_CREDENTIALS; gcloud may or may not have
          # the SA in its own credential store, so activate it if needed.
          # No new secrets and no new IAM grants are REQUIRED: if the service
          # account cannot read billingInfo the probe falls through to the
          # fail-open branch below.
          TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
          if [ -z "${TOKEN:-}" ] && [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
            TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
          fi
          if [ -z "${TOKEN:-}" ]; then
            # Cannot check ≠ known-bad. Warn and let the deploy proceed.
            echo "::warning::Preflight could not mint an access token; skipping the billing check (treated as transient, not fatal)."
            exit 0
          fi

          # ── DO NOT REPLACE THIS WITH A cloudfunctions.list PROBE ────────────
          # The first version of this gate (PR #396) probed
          #   GET cloudfunctions.googleapis.com/v2/projects/$P/locations/-/functions
          # on the theory that "if we can talk to the Functions API we can deploy".
          # That is FALSE: *reading* the Functions API does not require an active
          # billing account, only writes/deploys do. On run 30755911112 (main,
          # 2026-08-02 16:11Z) that probe returned HTTP 200 on a project whose
          # billing was definitively disabled, printed "Preflight OK", and let the
          # deploy proceed to redeploy firestore rules + indexes + storage before
          # dying on the functions loop — i.e. it produced exactly the half-applied
          # production state this gate exists to prevent. It is a false negative by
          # construction. Ask the billing API about billing instead.
          API="https://cloudbilling.googleapis.com/v1/projects/${PROJECT}/billingInfo"
          CODE=""; BODY=""
          for attempt in 1 2 3; do
            RESP="$(curl -sS -m 30 -w $'\n%{http_code}' -H "Authorization: Bearer ${TOKEN}" "$API" 2>&1)"
            CODE="$(printf '%s' "$RESP" | tail -n 1)"
            BODY="$(printf '%s' "$RESP" | sed '$d')"
            # A definitive answer from the API — stop retrying.
            case "$CODE" in
              200|401|403|404) break ;;
            esac
            echo "Preflight attempt ${attempt}/3: no definitive HTTP status (got '${CODE:-none}'); retrying…"
            sleep $((attempt * 5))
          done

          # ABORTS THE DEPLOY (fail closed), case 1 — the authoritative answer:
          # HTTP 200 from the billing API with "billingEnabled": false. There is
          # no ambiguity in this response; the functions loop below cannot
          # possibly succeed, so nothing may deploy.
          # Parsed with grep rather than jq deliberately: jq is not guaranteed on
          # every runner image, and a missing jq must not turn a definitive
          # answer into an inconclusive one.
          if [ "$CODE" = "200" ] && printf '%s' "$BODY" \
              | grep -qE '"billingEnabled"[[:space:]]*:[[:space:]]*false'; then
            BILLING_VERDICT="billingEnabled=false reported by the Cloud Billing API"
          # ABORTS THE DEPLOY (fail closed), case 2 — the pre-existing signal,
          # kept because it is still correct whenever it fires: an HTTP 403 whose
          # body actually names billing. Note this branch is what a *disabled*
          # cloudbilling API surface also looks like.
          elif [ "$CODE" = "403" ] && printf '%s' "$BODY" | grep -qiE \
              'billingNotEnabled|SERVICE_DISABLED|requires billing to be enabled|check billing account'; then
            BILLING_VERDICT="HTTP 403 naming billing (${CODE})"
          else
            BILLING_VERDICT=""
          fi

          if [ -n "$BILLING_VERDICT" ]; then
            echo "::error::DEPLOY ABORTED BEFORE ANY CHANGE WAS APPLIED — GCP billing is disabled on project ${PROJECT}."
            echo ""
            echo "=================================================================="
            echo " GCP BILLING IS DISABLED ON PROJECT: ${PROJECT}"
            echo ""
            echo " Cloud Functions cannot deploy while billing is off, but Firestore"
            echo " rules CAN — so continuing would push new rules to production and"
            echo " leave them enforcing against the OLD functions and OLD frontend."
            echo " Aborting BEFORE any deploy so production is not left half-updated."
            echo ""
            echo " FIX: re-enable billing, then re-run this job:"
            echo "   https://console.cloud.google.com/billing/linkedaccount?project=${PROJECT}"
            echo "=================================================================="
            echo ""
            echo "Signal: ${BILLING_VERDICT}"
            echo "API response (HTTP ${CODE}):"
            printf '%s\n' "$BODY"
            exit 1
          fi

          # DOES NOT ABORT (fail open): network timeouts, empty/garbage status,
          # 5xx, 404, 401, and 403s that do NOT name billing (most importantly:
          # the service account simply lacking cloudbilling read access). None of
          # those prove the project is undeployable, and blocking on them would
          # wedge every deploy forever. The real deploy still fails loudly if
          # they matter — this gate only exists to stop the *half*-applied case.
          if [ "$CODE" = "200" ] && printf '%s' "$BODY" \
              | grep -qE '"billingEnabled"[[:space:]]*:[[:space:]]*true'; then
            echo "Preflight OK: billing is enabled on ${PROJECT}; proceeding with deploy."
          else
            echo "::warning::Preflight inconclusive (HTTP ${CODE:-none}, no definitive billingEnabled value). Proceeding with the deploy."
            printf '%s\n' "$BODY" | head -n 20
          fi

      - name: Deploy to Firebase
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          echo "Deploying to $PROJECT"

          # 1) Rules, indexes and storage first — these are backward-compatible
          #    and must be in place before the functions that rely on them.
          #    HOSTING IS DEPLOYED LAST, in a separate step, and ONLY if every
          #    function deployed. Releasing hosting before functions is what
          #    broke production on 2026-08-02: the new frontend went live
          #    calling `getLoanConfig`, the functions deploy then failed on a
          #    billing 403, and the loan wizard fail-closed for every borrower
          #    against a callable that had never been deployed.
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project "$PROJECT" --non-interactive

          # 2) Functions ONE AT A TIME. Changing shared env (e.g. a secret)
          #    forces a new Cloud Run revision for EVERY gen2 function; each new
          #    revision holds ~1 CPU during its health-check. The project's
          #    "total allowable CPU per project per region" quota is low and
          #    cannot be raised, so we deploy a single function at a time and let
          #    its instance scale back to zero before the next one. Retries with
          #    backoff absorb any leftover warm instances still occupying CPU.
          #    Functions are ordered service-callers FIRST so the INTERNAL_SECRET
          #    auth path (requestLoan / onLoanApproved / generatePaymentLink …) is
          #    fixed early even if later, non-critical functions need a re-run.
          #    KEEP IN SYNC with the exported functions in functions/src/index.ts.
          FUNCTIONS="
            requestLoan getLoanConfig onLoanApproved generatePaymentLink markLoanDisbursed
            metamapWebhook getSystemHealth systemHealthCheck queueHealthCheck
            processPayroll satBlacklistRefresh refreshSatBlacklists
            api checkEmailAvailability validateCURP updateLoanStatus
            approveEmployer getPortfolioReport getAdminDashboard getEmployerDashboard
            submitReviewDecision getReviewDetail updateEmployerTier setEmployerClaims
            updateEmployerCurpConfig getContractDownloadUrl setAdminClaim revokeAdminClaim
            sendVerificationEmail sendEmployeeInvite lookupInvite acceptInvite
            onContactCreated onEmployerDocCreated onLoanStatusChange onEmployeeDocCreated
            autoVerifyOnEmployerCreate autoVerifyOnEmployeeCreate dailyLoanCheck
            weeklyPortfolioSnapshot
          "

          # Account-level failures (billing disabled, write access denied, API
          # turned off) are deterministic: they will fail identically on every
          # function and every attempt. Retrying them 4x across ~40 functions
          # costs ~6h and buries the real cause under 256 identical errors.
          # Detect them and abort the whole deploy at the first occurrence.
          FATAL=0
          is_fatal() {
            printf '%s' "$1" | grep -qiE \
              "please check billing account|billing account .*(disabled|closed|not (found|active))|Write access to project .* was denied|billing (is )?(not enabled|disabled)|SERVICE_DISABLED|PERMISSION_DENIED.*(billing|serviceusage)"
          }

          deploy_one() {
            local fn="$1" attempt out rc
            for attempt in 1 2 3 4; do
              echo "::group::Deploy ${fn} (attempt ${attempt}/4)"
              set +e
              out="$(firebase deploy --only "functions:${fn}" --project "$PROJECT" --non-interactive --force 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$out"
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if is_fatal "$out"; then
                echo "::error::${fn}: non-retryable account-level failure (billing or project permissions), not a transient CPU-quota backoff. Aborting the deploy now instead of retrying ~40 functions into the 6h job limit."
                FATAL=1
                return 1
              fi
              echo "  ${fn} failed (attempt ${attempt}); backing off so CPU can free up…"
              sleep $((attempt * 60))
            done
            return 1
          }

          total=0; for fn in $FUNCTIONS; do total=$((total+1)); done
          idx=0; ok=0; FAILED=""
          for fn in $FUNCTIONS; do
            idx=$((idx+1))
            echo "=== [${idx}/${total}] ${fn} ==="
            if deploy_one "$fn"; then
              ok=$((ok+1))
            else
              FAILED="${FAILED} ${fn}"
              if [ "$FATAL" = "1" ]; then
                echo "::error::Aborting after a non-retryable failure on ${fn}. Deployed ${ok}/${total} before the abort; hosting will NOT be released."
                break
              fi
              echo "::warning::${fn} did not deploy after retries"
            fi
            # brief settle so the new revision can scale to zero before the next
            if [ "$idx" -lt "$total" ]; then sleep 30; fi
          done

          echo "Deployed ${ok}/${total} functions."
          if [ "$FATAL" = "1" ]; then
            echo "::error::Deploy aborted: the Google Cloud project rejected function writes (billing or project permissions). Hosting was deliberately left on the previous release so production is not left running a frontend against undeployed backend code. Fix the account issue, then re-run this job."
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Functions that failed after retries:${FAILED}"
            echo "Re-run this job to retry TRANSIENT failures (e.g. CPU-quota backoff) — already-deployed functions are skipped, so those converge."
            echo "EXCEPTION: a trigger-type change (e.g. HTTPS -> Firestore/other event trigger) never converges via re-run, no matter how many times."
            echo "Firebase refuses to change a deployed function's trigger type in place; check the per-function error above for"
            echo "'is not allowed. Please delete your function and create a new one instead.' -- if present, re-running just wastes another cycle."
            echo "That function must be deleted first (firebase functions:delete <name> --region <region> --project <id>), then the next deploy recreates it."
            exit 1
          fi
          echo "All ${total} functions deployed successfully."

      # Hosting goes LAST and only on a fully successful functions deploy, so a
      # backend failure can never leave production serving a frontend that calls
      # callables which were never deployed.
      - name: Deploy Hosting (only after all functions succeeded)
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          echo "Releasing hosting to $PROJECT"
          firebase deploy --only hosting --project "$PROJECT" --non-interactive

