name: VIDA Platform — Deploy

on:
  push:
    branches:
      - main      # → production
      - develop   # → staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: TypeScript check (Cloud Functions)
        run: cd functions && npm run build

      - name: Setup Java 21 (required by Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase CLI (service account)
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}" | base64 -d > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"

      - name: Run Firestore rules tests
        run: firebase emulators:exec --only firestore --project vida-finance-test 'npm test'

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Firebase
  # ─────────────────────────────────────────────
  deploy-firebase:
    name: Deploy Firebase (Hosting + Functions + Rules)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Deploy to Firebase (Staging)
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}" | base64 -d > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx firebase-tools deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project ${{ secrets.FIREBASE_PROJECT_ID_STAGING }} \
            --non-interactive

      - name: Deploy to Firebase (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}" | base64 -d > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx firebase-tools deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project ${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }} \
            --non-interactive

  # ─────────────────────────────────────────────
  # JOB 3: Deploy Railway Microservices
  # ─────────────────────────────────────────────
  deploy-railway:
    name: Deploy Railway Microservices
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: payment-server
            dir: services/payment-server
          - name: softcredito-adapter
            dir: services/softcredito-adapter
          - name: notification-service
            dir: services/notification-service
          - name: pdf-generator
            dir: services/pdf-generator
          - name: ml-service
            dir: services/ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service.name }} to Staging
        if: github.ref == 'refs/heads/develop'
        run: railway up --service ${{ matrix.service.name }} --detach
        working-directory: ${{ matrix.service.dir }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Deploy ${{ matrix.service.name }} to Production
        if: github.ref == 'refs/heads/main'
        run: railway up --service ${{ matrix.service.name }} --detach
        working-directory: ${{ matrix.service.dir }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 4: Health Check Post-Deploy
  # ─────────────────────────────────────────────
  health-check:
    name: Post-Deploy Health Checks
    runs-on: ubuntu-latest
    needs: [deploy-railway]
    if: github.event_name == 'push'
    steps:
      - name: Wait 60s for Railway services to stabilize
        run: sleep 60

      - name: Health check all Railway services
        run: |
          ALL_OK=true
          check_health() {
            local url="$1"
            local service="$2"
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "✅ $service — healthy (HTTP $status)"
                return 0
              fi
              echo "  attempt $attempt/$max_attempts: $service returned $status, retrying in 15s..."
              sleep 15
              attempt=$((attempt + 1))
            done
            echo "❌ $service — not healthy after $max_attempts attempts (last: $status)"
            ALL_OK=false
            return 1
          }
          check_health "https://vida-payment-server.railway.app/health"   "payment-server"      || true
          check_health "https://vida-softcredito.railway.app/health"      "softcredito-adapter" || true
          check_health "https://vida-notifications.railway.app/health"    "notification-service" || true
          check_health "https://vida-pdf-generator.railway.app/health"    "pdf-generator"       || true
          check_health "https://vida-ml-service.railway.app/health"       "ml-service"          || true
          if [ "$ALL_OK" = "false" ]; then
            echo ""
            echo "⚠️  One or more Railway services did not pass health checks."
            echo "Check Railway logs: railway logs --service <name>"
            exit 1
          fi
          echo ""
          echo "🎉 All Railway services are healthy!"

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ VIDA Deploy to *${{ env.ENVIRONMENT }}* succeeded — all services healthy\"}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 VIDA Deploy to *${{ env.ENVIRONMENT }}* FAILED — check GitHub Actions\"}"
