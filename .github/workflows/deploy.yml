name: VIDA Platform — Deploy

on:
  push:
    branches:
      - main      # → production
      - develop   # → staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: TypeScript check (Cloud Functions)
        run: cd functions && npm run build

      - name: Run functions unit tests
        run: cd functions && npm test

  # ─────────────────────────────────────────────
  # JOB 1b: Integration Tests
  # ─────────────────────────────────────────────
  integration-test:
    name: Integration Tests (Decision Engine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root deps
        run: npm ci

      - name: Install Python deps (ml-service)
        run: |
          cd services/ml-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run JS integration tests
        run: npx jest --config tests/integration/jest.config.js
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

      - name: Run Python integration tests
        run: cd services/ml-service && python3 -m pytest ../../tests/integration/test_decision_paths.py -v
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Firebase
  # ─────────────────────────────────────────────
  deploy-firebase:
    name: Deploy Firebase (Hosting + Functions + Rules)
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            public-v2/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install frontend deps
        run: cd public-v2 && npm ci

      - name: Build frontend (public-v2)
        run: cd public-v2 && npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Deploy to Firebase
        run: |
          firebase deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_PROJECT_ID_PRODUCTION || secrets.FIREBASE_PROJECT_ID_STAGING }} \
            --non-interactive

  # ─────────────────────────────────────────────
  # JOB 3: Deploy Railway Microservices
  # ─────────────────────────────────────────────
  deploy-railway:
    name: Deploy Railway Microservices
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: vida-payment-server
            dir: services/payment-server
          - name: vida-softcredito
            dir: services/softcredito-adapter
          - name: vida-notifications
            dir: services/notification-service
          - name: vida-pdf-generator
            dir: services/pdf-generator
          - name: vida-ml-service
            dir: services/ml-service
          - name: vida-underwriting
            dir: services/underwriting-service
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service.name }} to Staging
        if: github.ref == 'refs/heads/develop'
        continue-on-error: true
        run: |
          railway redeploy --service ${{ matrix.service.name }} --yes || \
            echo "⚠️  railway redeploy skipped for ${{ matrix.service.name }} — Railway deploys via GitHub integration"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Deploy ${{ matrix.service.name }} to Production
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          railway redeploy --service ${{ matrix.service.name }} --yes || \
            echo "⚠️  railway redeploy skipped for ${{ matrix.service.name }} — Railway deploys via GitHub integration"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 4: Health Check Post-Deploy
  # ─────────────────────────────────────────────
  health-check:
    name: Post-Deploy Health Checks
    runs-on: ubuntu-latest
    needs: [deploy-firebase, deploy-railway]
    if: github.event_name == 'push'
    steps:
      - name: Wait 30s for services to stabilize
        run: sleep 30

      - name: Health check all Railway services
        run: |
          check_health() {
            local url="$1"
            local service="$2"
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "✅ $service — healthy (HTTP $status)"
                return 0
              fi
              echo "  attempt $attempt/$max_attempts: $service returned $status, retrying in 15s..."
              sleep 15
              attempt=$((attempt + 1))
            done
            echo "❌ $service — not healthy after $max_attempts attempts (last: $status)"
            return 1
          }
          check_health "https://vida-payment-server.railway.app/health"  "payment-server"
          check_health "https://vida-softcredito.railway.app/health"     "softcredito-adapter"
          check_health "https://vida-notifications.railway.app/health"   "notification-service"
          check_health "https://vida-pdf-generator.railway.app/health"   "pdf-generator"
          check_health "https://vida-ml-service.railway.app/health"      "ml-service"
          check_health "https://vida-underwriting.railway.app/health"   "underwriting-service"

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        run: |
          [ -n "$SLACK_URL" ] && curl -X POST "$SLACK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ VIDA Deploy to *${{ env.ENVIRONMENT }}* succeeded — all services healthy\"}" || true
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        run: |
          [ -n "$SLACK_URL" ] && curl -X POST "$SLACK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 VIDA Deploy to *${{ env.ENVIRONMENT }}* FAILED — check GitHub Actions\"}" || true
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
