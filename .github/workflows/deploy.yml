name: VIDA Platform — Deploy

on:
  push:
    branches:
      - main      # → production
      - develop   # → staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: TypeScript check (Cloud Functions)
        run: cd functions && npm run build

      - name: Run functions unit tests
        run: cd functions && npm test

  # ─────────────────────────────────────────────
  # JOB 1b: Integration Tests
  # ─────────────────────────────────────────────
  integration-test:
    name: Integration Tests (Decision Engine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root deps
        run: npm ci

      - name: Install Python deps (ml-service)
        run: |
          cd services/ml-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run JS integration tests
        run: npx jest --config tests/integration/jest.config.js
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

      - name: Run Python integration tests
        run: cd services/ml-service && python3 -m pytest ../../tests/integration/test_decision_paths.py -v
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Firebase
  # ─────────────────────────────────────────────
  deploy-firebase:
    name: Deploy Firebase (Hosting + Functions + Rules)
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push'
    # ── WHY THIS IS ON THE JOB AND NOT THE WORKFLOW ──────────────────────
    # Two pushes to main close together produce two runs that reach this job
    # at the same time and deploy the SAME Firebase project concurrently.
    # Observed 2026-08-02 18:14Z/18:17Z: runs 30760666827 (50d340e) and
    # 30760796507 (0600a47) were both mid-`firebase deploy` against
    # production. That is last-writer-wins on ~40 functions, the rules file
    # and the hosting bundle — and the writers finish out of order, because
    # the loop's duration depends on which functions changed, not on which
    # commit is newer. The older run can therefore release OLD rules over
    # the newer run's, silently reverting a merged security fix.
    #
    # cancel-in-progress is deliberately FALSE. Cancelling a running deploy
    # is the one thing worse than racing: it stops the loop partway and
    # leaves production with some functions new and some old, which is the
    # incoherent state the #404 ordering exists to prevent. Queue instead.
    #
    # Job-level, not workflow-level, so PR validation runs (which skip this
    # job entirely) are never made to queue behind a production deploy.
    concurrency:
      group: deploy-firebase-${{ github.ref }}
      cancel-in-progress: false
    # Without this the job runs to the 6h runner limit and is reported as
    # "cancelled" rather than "failed" — which raises no alert. See the
    # 2026-08-02 incident: three consecutive main deploys burned 6h each on a
    # non-retryable billing 403 and nobody was told.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            public-v2/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          UNDERWRITING_SERVICE_URL=${{ secrets.UNDERWRITING_SERVICE_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          REGISTRY_SERVICE_URL=${{ secrets.REGISTRY_SERVICE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE=${{ github.sha }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install frontend deps
        run: cd public-v2 && npm ci --legacy-peer-deps

      - name: Build frontend (public-v2)
        run: cd public-v2 && npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      # ── WHY THIS STEP EXISTS — DO NOT DELETE AS "REDUNDANT" ──────────────
      # The deploy below is a COUPLED change: rules + functions + hosting must
      # land together. But they have different prerequisites — rules/indexes/
      # storage still deploy on a project that refuses Cloud Functions writes
      # (whatever the cause: closed/suspended billing account, missing IAM, a
      # disabled API). Without this gate a push to main happily writes
      # NEW FIRESTORE RULES to production and then fails on the functions loop,
      # leaving prod enforcing new rules against the OLD frontend and the OLD
      # functions. That is exactly what broke production on 2026-08-02.
      # The per-function is_fatal() check further down aborts too LATE: by then
      # the rules are already live. This step aborts BEFORE anything deploys.
      - name: Preflight — write canary (can this project accept a deploy?)
        if: github.event_name == 'push'
        run: |
          # NOTE: `set +e` is deliberate. GitHub's default shell is `bash -e {0}`,
          # and this step inspects exit codes / HTTP statuses itself to decide
          # what is fatal vs. transient — inherited -e would abort on a merely
          # inconclusive probe, i.e. fail closed on transient noise.
          set -uo pipefail
          set +e
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          # Must match the region the functions loop below actually deploys to.
          # No setGlobalOptions()/region() anywhere in functions/src, so
          # firebase-functions uses its default region. KEEP IN SYNC.
          REGION="us-central1"
          echo "Preflight: probing whether ${PROJECT} accepts Cloud Functions writes…"

          # Reuse the credentials from "Authenticate to Google Cloud". That step
          # exports GOOGLE_APPLICATION_CREDENTIALS; gcloud may or may not have
          # the SA in its own credential store, so activate it if needed.
          # No new secrets and NO new IAM grants are required: this is the same
          # SA and the same API call `firebase deploy --only functions` makes as
          # its first write, so if it can deploy at all it can run this probe.
          TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
          if [ -z "${TOKEN:-}" ] && [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
            TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
          fi
          if [ -z "${TOKEN:-}" ]; then
            # Cannot check ≠ known-bad. Warn and let the deploy proceed; the
            # "Deploy to Firebase" step re-probes because CANARY_WRITE_OK != 1.
            echo "CANARY_WRITE_OK=0" >> "${GITHUB_ENV:-/dev/null}"
            echo "::warning::Preflight could not mint an access token; skipping the write canary (treated as transient, not fatal)."
            exit 0
          fi

          # ══ TWO PREVIOUS PROBES WERE BOTH WRONG. DO NOT GO BACK TO EITHER. ══
          #
          # DEAD PROBE 1 (PR #396) — GET .../v2/projects/$P/locations/-/functions
          #   Theory: "if we can talk to the Functions API we can deploy."
          #   FALSE: *reading* the Functions API never required an active billing
          #   account; only writes do. Run 30755911112 (main, 2026-08-02 16:11Z)
          #   returned HTTP 200 on a project that could not deploy, printed
          #   "Preflight OK", and let firestore rules + indexes + storage ship
          #   before the functions loop died. It probed the wrong verb.
          #
          # DEAD PROBE 2 (PR #397) — GET cloudbilling/v1/projects/$P/billingInfo
          #   Theory: "ask the billing API about billing."
          #   ALSO FALSE. Run 30756695646 (main, 2026-08-02 16:28Z) printed
          #   "Preflight OK: billing is enabled on <project>" — billingEnabled was
          #   genuinely true — and the very next step got HTTP 403 "Write access
          #   to project '<P>' was denied: please check billing account associated
          #   and retry" from functions:generateUploadUrl. A billing account can
          #   report as *linked* while being closed, suspended or delinquent, so
          #   billingEnabled=true does not imply writes are accepted. It probed
          #   the wrong resource.
          #
          # Both were indirect proxies for "can this project accept a deploy",
          # and both were false negatives. So stop proxying: probe the exact
          # operation that fails. functions:generateUploadUrl is the ideal
          # canary — it is the FIRST real write `firebase deploy --only
          # functions` performs, it is idempotent, and it persists nothing: it
          # just mints a short-lived signed upload URL that we throw away.
          # HTTP 200 here is positive PROOF of write capability, not an inference.
          CANARY="https://cloudfunctions.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/functions:generateUploadUrl"
          CODE=""; BODY=""
          for attempt in 1 2 3; do
            RESP="$(curl -sS -m 30 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -w $'\n%{http_code}' "$CANARY" 2>&1)"
            CODE="$(printf '%s' "$RESP" | tail -n 1)"
            BODY="$(printf '%s' "$RESP" | sed '$d')"
            # A definitive answer about write capability — stop retrying.
            case "$CODE" in
              200|401|403|404) break ;;
            esac
            # 429 / 5xx / curl timeout (000) / empty status: transient noise.
            echo "Preflight attempt ${attempt}/3: no definitive HTTP status (got '${CODE:-none}'); retrying…"
            sleep $((attempt * 5))
          done

          # ABORTS THE DEPLOY (fail closed) — HTTP 403 on the write canary.
          # This is the only fatal branch, and it is unambiguous: the project
          # refused the first write the deploy makes, so the functions loop
          # cannot possibly succeed. Deliberately NOT conditioned on the body
          # naming billing — a 403 from missing cloudfunctions write IAM is
          # equally undeployable, and body-matching is how probe 2 got fooled.
          if [ "$CODE" = "403" ]; then
            echo "::error::DEPLOY ABORTED BEFORE ANY CHANGE WAS APPLIED — project ${PROJECT} refused a Cloud Functions write (HTTP 403)."
            echo ""
            echo "=================================================================="
            echo " PROJECT REJECTS CLOUD FUNCTIONS WRITES: ${PROJECT}"
            echo ""
            echo " Measured directly: POST functions:generateUploadUrl returned 403."
            echo " That is the first write a functions deploy performs, so this"
            echo " deploy cannot succeed. Note this says nothing about whether the"
            echo " billing API reports billing as enabled — it did report enabled"
            echo " on run 30756695646 while writes were being denied. A linked"
            echo " billing account can still be closed, suspended or delinquent."
            echo " The other cause of a 403 here is the deploy service account"
            echo " lacking Cloud Functions write permission."
            echo ""
            echo " Cloud Functions cannot deploy in this state, but Firestore"
            echo " rules CAN — so continuing would push new rules to production and"
            echo " leave them enforcing against the OLD functions and OLD frontend."
            echo " Aborting BEFORE any deploy so production is not left half-updated."
            echo ""
            echo " FIX: check the linked billing account (closed/suspended/past due)"
            echo " and the deploy service account's roles, then re-run this job:"
            echo "   https://console.cloud.google.com/billing/linkedaccount?project=${PROJECT}"
            echo "=================================================================="
            echo ""
            echo "Full canary response (HTTP ${CODE}):"
            printf '%s\n' "$BODY"
            exit 1
          fi

          # DOES NOT ABORT (fail open): 401, 404, 429, 5xx, curl timeouts and
          # empty/garbage statuses. None of those prove the project is
          # undeployable, and failing closed on them would wedge every deploy on
          # transient noise. 401 in particular is a credential problem — the real
          # deploy will fail loudly and correctly on its own. This gate exists
          # only to stop the *half*-applied case, not to be a second deploy.
          if [ "$CODE" = "200" ]; then
            echo "CANARY_WRITE_OK=1" >> "${GITHUB_ENV:-/dev/null}"
            echo "Preflight OK: ${PROJECT} accepted a Cloud Functions write probe (HTTP 200); proceeding with deploy."
          else
            echo "CANARY_WRITE_OK=0" >> "${GITHUB_ENV:-/dev/null}"
            echo "::warning::Preflight write canary inconclusive (HTTP ${CODE:-none}). Proceeding; the deploy step re-probes once before applying anything."
            printf '%s\n' "$BODY" | head -n 20
          fi

      - name: Deploy to Firebase
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          REGION="us-central1"   # KEEP IN SYNC with the preflight canary above
          echo "Deploying to $PROJECT"

          # ── 0) LAST-CHANCE WRITE CANARY — nothing above this line has mutated
          #    anything, and nothing below may run until this passes.
          #
          #    Why this exists even though the preflight step already ran: that
          #    step fails OPEN on transient noise (401/429/5xx/timeout), by
          #    design, so a deploy CAN reach this point with no positive proof of
          #    write capability — which is exactly the state that produces the
          #    half-applied production we are trying to prevent. It also closes
          #    the (small) race between the preflight step and this one. So every
          #    write below — functions, rules, indexes, hosting — is gated on a
          #    canary that returned 200, in every path.
          #
          #    ATOMICITY DISCLAIMER — READ BEFORE TRUSTING THIS: this is
          #    best-effort ordering, NOT a transaction. It guarantees that
          #    NOTHING is applied when the project is known to refuse writes, and
          #    that each stage is applied only after its own preconditions are
          #    live. It does NOT guarantee all-or-nothing. What a mid-deploy
          #    failure now leaves behind, by stage:
          #      functions loop  → some functions new, some old; rules, indexes
          #                        and hosting all still on the previous release.
          #                        The deployed frontend is unchanged, so it only
          #                        calls callables that already existed.
          #      rules           → backend new, rules/hosting old. On the paths
          #                        the old frontend uses, the old rules are the
          #                        MORE permissive ones (#385 delete lockdown,
          #                        #391 employer-list lockdown both tighten), so
          #                        this is a security gap to close, not an outage.
          #                        The reads the new rules newly ALLOW (audit_log)
          #                        are only issued by the new console, which is
          #                        still behind this failure.
          #      indexes         → backend + rules new, hosting old. The old
          #                        frontend does not issue the queries the new
          #                        indexes serve.
          #    In every case production is left coherent-but-older, which is the
          #    property the previous ordering did not have: it could leave new
          #    rules enforcing against an old frontend, which IS an outage.
          if [ "${CANARY_WRITE_OK:-0}" = "1" ]; then
            echo "Write canary already confirmed in preflight (HTTP 200); proceeding."
          else
            echo "Preflight canary did not confirm write access; re-probing once before applying anything…"
            set +e
            TOKEN="$(gcloud auth print-access-token 2>/dev/null)"
            RESP="$(curl -sS -m 30 -X POST \
              -H "Authorization: Bearer ${TOKEN:-}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -w $'\n%{http_code}' \
              "https://cloudfunctions.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/functions:generateUploadUrl" 2>&1)"
            set -e
            CODE="$(printf '%s' "$RESP" | tail -n 1)"
            if [ "$CODE" = "403" ]; then
              echo "::error::DEPLOY ABORTED BEFORE ANY CHANGE WAS APPLIED — project ${PROJECT} refused a Cloud Functions write (HTTP 403). No rules, indexes, storage, functions or hosting were touched. Check the linked billing account (it can report as enabled while closed/suspended/delinquent) and the deploy service account's Cloud Functions permissions: https://console.cloud.google.com/billing/linkedaccount?project=${PROJECT}"
              printf '%s\n' "$RESP" | sed '$d'
              exit 1
            elif [ "$CODE" = "200" ]; then
              echo "Re-probe OK: ${PROJECT} accepted a Cloud Functions write (HTTP 200)."
            else
              echo "::warning::Re-probe still inconclusive (HTTP ${CODE:-none}); proceeding — see the atomicity disclaimer above."
            fi
          fi

          # DEPLOY ORDER — functions, then rules, then indexes, then hosting.
          #
          # Rules used to go FIRST, on the claim that they are "backward-compatible
          # and must be in place before the functions that rely on them". Both
          # halves of that claim are false, and the run on 2026-08-02T18:04Z proved
          # the cost of believing them:
          #
          #  a) Functions use the Admin SDK, which bypasses firestore.rules
          #     entirely. NO function has ever relied on a rule being deployed.
          #  b) The rules are NOT backward-compatible with the currently-deployed
          #     frontend. #391 locks `/employers` list access to ops-only, on the
          #     understanding that clients switch to the `lookupEmployerByCode`
          #     callable. Ship the rules first and, for the whole ~40-function
          #     deploy loop below, production is old frontend + new rules =
          #     employee onboarding is DOWN. Ship the rules and then fail the
          #     loop, and it stays down until someone notices.
          #
          # So: rules go out AFTER the backend they assume, and BEFORE the
          # frontend that they govern. Each stage is a precondition of the next,
          # and a failure at any stage leaves production coherent-but-older
          # rather than incoherent-and-newer.
          #
          # HOSTING IS STILL LAST, in its own step, and only on a fully
          # successful backend. Releasing hosting before functions is what broke
          # production on 2026-08-02: the new frontend went live calling
          # `getLoanConfig`, the functions deploy then failed on a billing 403,
          # and the loan wizard fail-closed for every borrower against a callable
          # that had never been deployed.

          # 1) Functions deployed in BATCHES via a single
          #    `firebase deploy --only functions:a,b,c` call per batch, instead
          #    of one `firebase deploy` invocation per function.
          #
          #    Deploying one function at a time (the previous design) was a
          #    mitigation for a real constraint that still applies: changing
          #    shared env (e.g. a secret) forces a new Cloud Run revision for
          #    EVERY gen2 function, and each new revision holds ~1 CPU during
          #    its health-check, against a low, non-raisable per-project
          #    per-region CPU quota. But one-at-a-time also re-packages and
          #    re-uploads the ENTIRE functions source bundle once per function —
          #    ~40x redundant work — which is most of why a deploy took
          #    40-70 minutes against the 90-minute job timeout.
          #
          #    BATCH_SIZE is deliberately conservative and lives in ONE place so
          #    it's trivially tunable: 6 concurrent functions per `firebase
          #    deploy` call cuts ~40 invocations (and ~40 redundant
          #    package/upload cycles) down to ~7, while still keeping the number
          #    of simultaneous new revisions health-checking at once — and
          #    therefore the CPU held concurrently — to a small fraction of the
          #    full function set, not all ~40 at once. If CPU-quota errors
          #    reappear, lower this number; do NOT jump to deploying all ~40 in
          #    one call.
          BATCH_SIZE=6

          # Functions are ordered service-callers FIRST so the INTERNAL_SECRET
          # auth path (requestLoan / onLoanApproved / generatePaymentLink …) is
          # fixed early even if later, non-critical functions need a re-run.
          # This ordering is preserved batch-by-batch and inside the
          # per-function fallback below. KEEP IN SYNC with the exported
          # functions in functions/src/index.ts.
          FUNCTIONS="
            requestLoan getLoanConfig onLoanApproved generatePaymentLink markLoanDisbursed
            metamapWebhook getSystemHealth systemHealthCheck queueHealthCheck
            processPayroll satBlacklistRefresh refreshSatBlacklists
            api checkEmailAvailability validateCURP updateLoanStatus
            approveEmployer getPortfolioReport getAdminDashboard getEmployerDashboard
            submitReviewDecision getReviewDetail getReviewQueue updateEmployerTier setEmployerClaims
            updateEmployerCurpConfig getContractDownloadUrl setAdminClaim revokeAdminClaim
            submitEmployerDocs submitPayrollDeductionSetup ensureEmployerCode
            proposeLoanConfigChange approveLoanConfigChange
            sendVerificationEmail sendEmployeeInvite lookupInvite acceptInvite
            lookupEmployerByCode
            onContactCreated onEmployerDocCreated onLoanStatusChange onEmployeeDocCreated
            autoVerifyOnEmployerCreate autoVerifyOnEmployeeCreate dailyLoanCheck
            weeklyPortfolioSnapshot
          "

          # Account-level failures (billing disabled, write access denied, API
          # turned off) are deterministic: they will fail identically on every
          # function and every attempt. Retrying them 4x across every batch
          # costs hours and buries the real cause under repeated identical
          # errors. Detect them and abort the whole deploy at the first
          # occurrence.
          FATAL=0
          is_fatal() {
            printf '%s' "$1" | grep -qiE \
              "please check billing account|billing account .*(disabled|closed|not (found|active))|Write access to project .* was denied|billing (is )?(not enabled|disabled)|SERVICE_DISABLED|PERMISSION_DENIED.*(billing|serviceusage)"
          }

          # Deploys a single function with a 4-attempt retry + backoff. This is
          # the fallback path used below when a whole batch fails: falling back
          # to one-at-a-time for just that batch means one poisoned function
          # cannot take down the other, healthy functions batched alongside it.
          deploy_one() {
            local fn="$1" attempt out rc
            for attempt in 1 2 3 4; do
              echo "::group::Deploy ${fn} (attempt ${attempt}/4)"
              set +e
              out="$(firebase deploy --only "functions:${fn}" --project "$PROJECT" --non-interactive --force 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$out"
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if is_fatal "$out"; then
                echo "::error::${fn}: non-retryable account-level failure (billing or project permissions), not a transient CPU-quota backoff. Aborting the deploy now."
                FATAL=1
                return 1
              fi
              echo "  ${fn} failed (attempt ${attempt}); backing off so CPU can free up…"
              sleep $((attempt * 60))
            done
            return 1
          }

          # Deploys a batch with the same 4-attempt retry + backoff the old
          # single-function loop used. Takes an ALREADY-BUILT --only selector
          # (see the construction below — every function carries its own
          # `functions:` prefix; this is load-bearing, not stylistic).
          # Returns 0 if the WHOLE batch deployed in one shot; 1 otherwise —
          # either FATAL=1 was set (non-retryable), or all 4 attempts were
          # exhausted and the caller should fall back to deploy_one per
          # function.
          deploy_batch() {
            local only_arg="$1" label="$2" attempt out rc
            for attempt in 1 2 3 4; do
              echo "::group::Deploy batch [${label}] (attempt ${attempt}/4): ${only_arg}"
              set +e
              out="$(firebase deploy --only "${only_arg}" --project "$PROJECT" --non-interactive --force 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$out"
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if is_fatal "$out"; then
                echo "::error::Batch [${label}]: non-retryable account-level failure (billing or project permissions), not a transient CPU-quota backoff. Aborting the deploy now instead of retrying every batch into the 6h job limit."
                FATAL=1
                return 1
              fi
              echo "  batch [${label}] failed (attempt ${attempt}); backing off so CPU can free up…"
              sleep $((attempt * 60))
            done
            echo "  batch [${label}] failed after 4 attempts; falling back to deploying its functions individually so one poisoned function does not take down the rest of the batch."
            return 1
          }

          FUNCTIONS_ARR=($FUNCTIONS)
          total=${#FUNCTIONS_ARR[@]}
          ok=0; FAILED=""
          i=0; batch_num=0; num_batches=$(( (total + BATCH_SIZE - 1) / BATCH_SIZE ))
          while [ "$i" -lt "$total" ]; do
            batch_num=$((batch_num+1))
            batch=("${FUNCTIONS_ARR[@]:$i:$BATCH_SIZE}")

            # EVERY function needs its own `functions:` prefix:
            #   --only functions:a,functions:b,functions:c
            #
            # NOT `--only functions:a,b,c`. That form looks correct and is
            # silently, dangerously wrong. firebase-tools splits --only on
            # commas and keeps only the selectors that literally start with
            # "functions:" (deploy/functions/functionsDeployHelper.js,
            # getEndpointFilters). So `functions:a,b,c` yields a filter for `a`
            # ALONE; `b` and `c` are dropped with no warning. filterTargets
            # still resolves the "functions" target from the first selector, so
            # the CLI exits 0 and the batch is counted as fully deployed.
            #
            # The failure mode that produces is the worst one this workflow has:
            # 1 of every 6 functions actually deploys, the run reports
            # "Deployed 40/40 functions", and hosting — which is gated on that
            # count — releases the new frontend against 33 stale functions. A
            # green check on an incoherent production state, which is precisely
            # what the ordering in this file exists to prevent.
            only_arg=""
            for fn in "${batch[@]}"; do
              only_arg="${only_arg:+${only_arg},}functions:${fn}"
            done

            echo "=== batch ${batch_num}/${num_batches} (functions $((i+1))-$((i+${#batch[@]}))/${total}): ${batch[*]} ==="
            if deploy_batch "$only_arg" "${batch_num}/${num_batches}"; then
              ok=$((ok+${#batch[@]}))
            elif [ "$FATAL" = "1" ]; then
              echo "::error::Aborting after a non-retryable failure in batch ${batch_num}. Deployed ${ok}/${total} before the abort; hosting will NOT be released."
              break
            else
              fb_idx=0; fb_total=${#batch[@]}
              for fn in "${batch[@]}"; do
                fb_idx=$((fb_idx+1))
                if deploy_one "$fn"; then
                  ok=$((ok+1))
                else
                  FAILED="${FAILED} ${fn}"
                  if [ "$FATAL" = "1" ]; then
                    break
                  fi
                  echo "::warning::${fn} did not deploy after retries"
                fi
                # brief settle so the new revision can scale to zero before the next
                if [ "$fb_idx" -lt "$fb_total" ]; then sleep 30; fi
              done
              if [ "$FATAL" = "1" ]; then
                echo "::error::Aborting after a non-retryable failure during individual fallback in batch ${batch_num}. Deployed ${ok}/${total} before the abort; hosting will NOT be released."
                break
              fi
            fi
            i=$((i+BATCH_SIZE))
            # brief settle so new revisions can scale to zero before the next batch
            if [ "$i" -lt "$total" ]; then sleep 30; fi
          done

          echo "Deployed ${ok}/${total} functions."
          if [ "$FATAL" = "1" ]; then
            echo "::error::Deploy aborted: the Google Cloud project rejected function writes (billing or project permissions). Hosting was deliberately left on the previous release so production is not left running a frontend against undeployed backend code. Fix the account issue, then re-run this job."
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Functions that failed after retries:${FAILED}"
            echo "Re-run this job to retry TRANSIENT failures (e.g. CPU-quota backoff) — already-deployed functions are skipped, so those converge."
            echo "EXCEPTION: a trigger-type change (e.g. HTTPS -> Firestore/other event trigger) never converges via re-run, no matter how many times."
            echo "Firebase refuses to change a deployed function's trigger type in place; check the per-function error above for"
            echo "'is not allowed. Please delete your function and create a new one instead.' -- if present, re-running just wastes another cycle."
            echo "That function must be deleted first (firebase functions:delete <name> --region <region> --project <id>), then the next deploy recreates it."
            exit 1
          fi
          echo "All ${total} functions deployed successfully."

          # 2) Rules + storage, now that the backend they assume is live.
          #    Fatal: these are the security surface (#385 delete lockdown, #391
          #    employer-list lockdown). A failure here must go red and must stop
          #    hosting, because the new frontend is written against these rules.
          echo "=== Deploying firestore rules + storage rules ==="
          firebase deploy \
            --only firestore:rules,storage \
            --project "$PROJECT" --non-interactive

      # 3) Indexes are additive — creating one never breaks an existing query —
      #    so they come after the rules. They still gate hosting: the admin
      #    console's server-side action filter (#402) throws FAILED_PRECONDITION
      #    against a missing composite index, so releasing the frontend without
      #    them ships a broken console.
      #
      #    Split into its own step because it is the ONE stage with a distinct
      #    IAM requirement — index creation needs datastore.indexes.create, which
      #    is NOT implied by the Cloud Functions / rules permissions the canary
      #    proves. On 2026-08-02T18:04Z the canary returned 200 and this call
      #    still returned 403, and because it was bundled with the rules deploy
      #    the error surfaced as a bare CLI stack trace with no owner and no fix.
      - name: Deploy Firestore indexes
        run: |
          set -uo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          echo "Deploying firestore indexes to $PROJECT"
          set +e
          out="$(firebase deploy --only firestore:indexes --project "$PROJECT" --non-interactive 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            if printf '%s' "$out" | grep -qiE 'HTTP Error: 403|PERMISSION_DENIED|caller does not have permission'; then
              # ── WHY A 403 HERE NO LONGER BLOCKS HOSTING ──────────────────
              # Measured 2026-08-02T20:06Z on run 30761707373: all 42 functions
              # and the rules deployed successfully, and then THIS step's
              # `exit 1` stopped the job before hosting. Every main deploy since
              # 2026-07-31T00:21Z died the same way, so production had been
              # serving a two-day-old frontend against fresh functions — which
              # is precisely the split-brain the hosting-last ordering exists to
              # prevent, arrived at from the other direction.
              #
              # The hosting-last rule guards against serving a frontend that
              # calls callables which were never deployed. A missing INDEX is
              # not that: the callables are live, and a stale index degrades
              # specific composite queries (currently only the ops-console
              # audit-history read) rather than breaking the borrower flow.
              # Holding the frontend back is strictly worse than shipping it.
              #
              # So: ship hosting, then fail the run at the end (see "Fail the
              # run if Firestore indexes were skipped"). The run still goes RED
              # so the IAM gap keeps alerting — it just stops taking the
              # frontend hostage while it does.
              echo "::warning::Firestore index deploy was REFUSED (403) by ${PROJECT}. Functions and rules DID deploy, and hosting will now proceed — a stale index degrades specific composite queries, it does not break deployed callables. This run will still be marked FAILED at the end so the gap stays visible. This is an IAM gap, not billing — the write canary passed on the same credentials in this run. The deploy service account needs index-write permission, which roles/firebase.developAdmin and roles/datastore.user do NOT include. FIX: gcloud projects add-iam-policy-binding ${PROJECT} --member=serviceAccount:<deploy-sa> --role=roles/datastore.indexAdmin   (see https://console.cloud.google.com/iam-admin/iam?project=${PROJECT}), then re-run this job."
              {
                echo "### ⚠️ Firestore indexes NOT deployed (403)"
                echo ""
                echo "Functions, rules and hosting **did** deploy. Composite indexes are stale."
                echo ""
                echo '```'
                echo "gcloud projects add-iam-policy-binding ${PROJECT} \\"
                echo "  --member=serviceAccount:<deploy-sa> --role=roles/datastore.indexAdmin"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "INDEX_DEPLOY_SKIPPED=1" >> "$GITHUB_ENV"
            else
              # Any non-permission failure is still fatal before hosting: it may
              # mean a malformed firestore.indexes.json or a project-level
              # refusal whose blast radius we have not characterised.
              echo "::error::Firestore index deploy failed on ${PROJECT}. Functions and rules DID deploy; hosting is held back. See the CLI output above."
              exit 1
            fi
          fi

      # Hosting goes LAST and only on a fully successful backend deploy, so a
      # backend failure can never leave production serving a frontend that calls
      # callables which were never deployed.
      - name: Deploy Hosting (only after all functions succeeded)
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          echo "Releasing hosting to $PROJECT"
          firebase deploy --only hosting --project "$PROJECT" --non-interactive

      # Deliberately AFTER hosting. The index 403 is a real defect and the run
      # must be red for it, but going red must not cost us the frontend release
      # — so we ship first and fail second. Without this the pipeline would go
      # green on a partial deploy, which is the silent rot the rest of this file
      # is written to avoid.
      - name: Fail the run if Firestore indexes were skipped
        if: env.INDEX_DEPLOY_SKIPPED == '1'
        run: |
          echo "::error::Deploy shipped functions, rules and hosting, but Firestore indexes were REFUSED (403). Grant roles/datastore.indexAdmin to the deploy service account and re-run. Failing the run so this does not go unnoticed."
          exit 1

