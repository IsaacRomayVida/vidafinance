name: VIDA Platform — Deploy

on:
  push:
    branches:
      - main      # → production
      - develop   # → staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────────
  test:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: TypeScript check (Cloud Functions)
        run: cd functions && npm run build

      - name: Run functions unit tests
        run: cd functions && npm test

  # ─────────────────────────────────────────────
  # JOB 1b: Integration Tests
  # ─────────────────────────────────────────────
  integration-test:
    name: Integration Tests (Decision Engine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root deps
        run: npm ci

      - name: Install Python deps (ml-service)
        run: |
          cd services/ml-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run JS integration tests
        run: npx jest --config tests/integration/jest.config.js
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

      - name: Run Python integration tests
        run: cd services/ml-service && python3 -m pytest ../../tests/integration/test_decision_paths.py -v
        env:
          METAMAP_MOCK: 'true'
          RISKSEAL_MOCK: 'true'

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Firebase
  # ─────────────────────────────────────────────
  deploy-firebase:
    name: Deploy Firebase (Hosting + Functions + Rules)
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            public-v2/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Write functions .env
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          UNDERWRITING_SERVICE_URL=${{ secrets.UNDERWRITING_SERVICE_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE=${{ github.sha }}
          ENVEOF

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install frontend deps
        run: cd public-v2 && npm ci --legacy-peer-deps

      - name: Build frontend (public-v2)
        run: cd public-v2 && npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Deploy to Firebase
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}"
          else
            PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
          fi
          echo "Deploying to $PROJECT"

          # 1) Non-function targets first (hosting, rules, indexes, storage).
          firebase deploy \
            --only hosting,firestore:rules,firestore:indexes,storage \
            --project "$PROJECT" --non-interactive

          # 2) Functions in small batches. Changing shared env (e.g. a secret)
          #    forces a new Cloud Run revision for EVERY gen2 function at once;
          #    each new revision transiently holds CPU during health-check, which
          #    blows the project's "total allowable CPU per project per region"
          #    quota. Deploy 3 at a time (service-callers first) with retries and
          #    cooldowns so we stay under quota and recover from transient blips.
          #    KEEP IN SYNC with the exported functions in functions/src/index.ts.
          BATCHES=(
            "requestLoan onLoanApproved generatePaymentLink"
            "markLoanDisbursed metamapWebhook getSystemHealth"
            "systemHealthCheck queueHealthCheck processPayroll"
            "satBlacklistRefresh refreshSatBlacklists api"
            "checkEmailAvailability validateCURP updateLoanStatus"
            "approveEmployer getPortfolioReport getAdminDashboard"
            "getEmployerDashboard submitReviewDecision getReviewDetail"
            "updateEmployerTier setEmployerClaims updateEmployerCurpConfig"
            "getContractDownloadUrl setAdminClaim revokeAdminClaim"
            "sendVerificationEmail sendEmployeeInvite lookupInvite"
            "acceptInvite onContactCreated onEmployerDocCreated"
            "onLoanStatusChange onEmployeeDocCreated autoVerifyOnEmployerCreate"
            "autoVerifyOnEmployeeCreate dailyLoanCheck weeklyPortfolioSnapshot"
          )

          deploy_batch() {
            local only="$1" label="$2" attempt
            for attempt in 1 2 3; do
              echo "::group::${label} (attempt ${attempt}/3)"
              if firebase deploy --only "$only" --project "$PROJECT" --non-interactive --force; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              echo "Batch failed on attempt ${attempt}; backing off before retry…"
              sleep $((attempt * 90))
            done
            return 1
          }

          FAILED=()
          n=${#BATCHES[@]}
          for i in "${!BATCHES[@]}"; do
            only=""
            for f in ${BATCHES[$i]}; do only="${only}functions:${f},"; done
            only="${only%,}"
            if deploy_batch "$only" "Functions batch $((i+1))/$n — ${BATCHES[$i]}"; then
              :
            else
              echo "::warning::Batch $((i+1)) did not deploy after retries: ${BATCHES[$i]}"
              FAILED+=("${BATCHES[$i]}")
            fi
            if [ $((i+1)) -lt "$n" ]; then echo "Cooling down 30s before next batch…"; sleep 30; fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::${#FAILED[@]} function batch(es) failed to deploy after retries:"
            printf '  - %s\n' "${FAILED[@]}"
            echo "Re-run this job after confirming the Cloud Run CPU quota; already-deployed functions are skipped automatically."
            exit 1
          fi
          echo "All ${n} function batches deployed successfully."

