name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    # NOTE: keep this name exactly "Lint, Typecheck & Test" — it's a
    # required status check context on main's branch protection
    # (contexts must match a job's `name:` verbatim). Renaming it here
    # without also updating branch protection would leave that required
    # check permanently unsatisfied and block all future merges.
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps (includes ESLint)
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: TypeScript typecheck (functions)
        run: cd functions && npm run typecheck

      # functions/tsconfig.json excludes src/**/*.test.ts, so the check above
      # never typechecks test files as one program — only ts-jest does, per file,
      # at test time. Two test files with no top-level import/export once collided
      # as global scripts (both declared `const mockLogger`), and that collision
      # only fired intermittently on the GitHub runner: it passed every local repro
      # attempt and passed `npm run typecheck`. That gap silently blocked prod
      # deploys for ~40 minutes (see #538). This step compiles every src file,
      # tests included, as one TS program so a redeclaration like that is a
      # deterministic compile error on every commit instead of an intermittent
      # test-time failure.
      - name: TypeScript typecheck (functions, including tests) — hard gate
        run: cd functions && npm run typecheck:tests

      - name: Lint (functions)
        run: cd functions && npm run lint

      # No count in this label on purpose. The previous one read 275/275 while the
      # suite had grown to 437, so the number aged into a false statement about a
      # gate — the one place a stale figure does the most damage, because it invites
      # "only 275 ran, the rest are optional". `npm run test:ci` fails the job on a
      # single failing test; that is what makes this a hard gate, not the count.
      - name: Unit tests (functions) — hard gate
        run: cd functions && npm run test:ci

      # scripts/migrations/*.ts was typechecked by nothing and tested by nothing
      # before migration 003. That migration deletes a field from every
      # historical loan document, so its precedence and skip logic is exactly the
      # kind of code that must not be allowed to regress unnoticed. Root deps are
      # already installed above, so these two steps cost seconds.
      - name: TypeScript typecheck (migration scripts)
        run: npm run typecheck:scripts

      - name: Unit tests (migration scripts) — hard gate
        run: npm run test:migrations

  underwriting-service:
    name: "Underwriting Service Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: services/underwriting-service/package-lock.json

      - name: Install underwriting-service dependencies
        run: cd services/underwriting-service && npm ci

      # #386 repaired this suite (50 -> 122 passing) and #395 made it a hard
      # gate. `npm test` fails the job on a single failing test; that property
      # is what makes it a gate, and it does not depend on any count — so no
      # count is named here. The step was called "139/139" while the suite
      # actually ran 150, the same drift eb224f7 took out of the functions job.
      #
      # Two suites once specified features that were never built (#387, #388)
      # and were held out — first via testPathIgnorePatterns (#395), then via
      # named describe.skip so the hole stayed counted instead of invisible.
      # Both issues are now CLOSED: #483/#486 built and wired the weighted
      # scoring engine (ADR-007), and #487 wired its output to the field the
      # loan-cap transaction enforces (ADR-008). jest.config.js excludes
      # nothing by name any more. One `it.skip` remains in
      # stage3-autoapprove.test.js, deliberately: it asserts a shadow/
      # challenger model gating a live decision, which ADR-001 §Decision.2
      # forbids until promoting that model is its own ratified event. That is
      # the only exclusion this gate carries, and it is by name, not by count.
      #
      # Do not add continue-on-error, and do not quiet the skip down. Red here
      # means something actually regressed. This gate covers every suite
      # `jest.config.js`'s `roots` collects; no count is named here on
      # purpose — see the functions job above for why a hardcoded number is
      # exactly the drift this comment exists to avoid repeating.
      - name: Unit tests (underwriting-service) — hard gate
        run: cd services/underwriting-service && npm test

  # Addresses the incident behind #425: softcredito-adapter and ml-service had
  # real test suites but no CI job ever ran them, which is how
  # /internal/disburse shipped to production publicly callable with no auth
  # header — the regression test for that exact bug (internalAuth.test.js)
  # existed and would have caught it, but nothing executed it before merge.
  #
  # test/*.test.js (P1-6) closed the second half of that gap: internalAuth,
  # bureauFallback and scToken covered helper libs only, but the Dockerfile
  # runs root index.js, and its actual route handlers -- /internal/disburse
  # (the real SPEI transfer), /internal/register-employer,
  # /internal/register-deduction, /internal/sync-repayments -- had zero
  # coverage. No count is named here on purpose (see the functions job above
  # for why) -- `npm test` fails the job on a single failing test, which is
  # what makes this a hard gate.
  softcredito-adapter:
    name: "Softcredito Adapter Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: services/softcredito-adapter/package-lock.json

      - name: Install softcredito-adapter dependencies
        run: cd services/softcredito-adapter && npm ci

      - name: Unit tests (softcredito-adapter) — internalAuth, bureauFallback, scToken, disburse/register-employer/register-deduction/sync-repayments handlers, hard gate
        run: cd services/softcredito-adapter && npm test

  # payment-server is the MONEY-IN surface: it receives CONEKTA card webhooks
  # and SPEI transfer webhooks and moves real money. Like softcredito-adapter
  # before #425, it had a real test suite risk (zero tests, in this case) and
  # no CI job — a regression here can silently lose or double-credit customer
  # payments. See the softcredito-adapter job above for the shape of the
  # incident this pattern addresses.
  payment-server:
    name: "Payment Server Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: services/payment-server/package-lock.json

      - name: Install payment-server dependencies
        run: cd services/payment-server && npm ci

      - name: Unit tests (payment-server) — internal auth, Conekta webhook signature, disbursement worker, hard gate
        run: cd services/payment-server && npm test

  # notification-service is the delivery path for every borrower notification
  # (loan approved, disbursed, repaid, overdue) via Twilio SMS/WhatsApp and
  # SendGrid email. Like softcredito-adapter before #425, it had zero tests,
  # no test script, and no CI job. See the softcredito-adapter job above for
  # the shape of the incident this pattern addresses.
  notification-service:
    name: "Notification Service Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install notification-service dependencies
        run: cd services/notification-service && npm ci

      # Nothing ran these before this job existed either — added alongside
      # the test suite since both were free-standing scripts nobody executed.
      - name: TypeScript typecheck (notification-service)
        run: cd services/notification-service && npm run typecheck

      # lint is intentionally NOT run here: services/notification-service/package.json
      # has always had a `lint` script but never a local `eslint` devDependency
      # (same gap as payment-server and pdf-generator's lint scripts), so
      # `npm run lint` fails with `eslint: not found` on main today, before any
      # change in this PR. Wiring it up is separate work; gating on a script
      # that was already broken would make this job red for a pre-existing
      # reason unrelated to what it's here to catch.
      - name: Unit tests (notification-service) — worker job handling, Twilio/SendGrid wrappers, hard gate
        run: cd services/notification-service && npm test

  # pdf-generator generates the loan contract PDF -- a document carrying
  # borrower PII and the loan's financial terms. Like softcredito-adapter
  # before #425, it had no test script and no CI job. See the
  # softcredito-adapter job above for the shape of the incident this pattern
  # addresses.
  pdf-generator:
    name: "PDF Generator Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: services/pdf-generator/package-lock.json

      - name: Install pdf-generator dependencies
        # The test suite mocks puppeteer entirely (no real browser is ever
        # launched), so skip downloading the bundled Chromium binary.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: cd services/pdf-generator && npm ci

      - name: Unit tests (pdf-generator) — internal auth, boot guard, contract generation, worker, hard gate
        run: cd services/pdf-generator && npm test

  # See the softcredito-adapter job above for why this exists (#425).
  ml-service:
    name: "ML Service Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ml-service/requirements.txt

      - name: Install ml-service dependencies
        run: cd services/ml-service && pip install -r requirements.txt -r requirements-dev.txt pytest pytest-asyncio

      # This repo declared black and flake8 as a pre-commit gate and then never
      # ran either one: lint-staged invoked `python -m black`, and the build host
      # has python3 only, so every commit touching a .py file died at ENOENT and
      # was made with --no-verify. The first run it ever completed reformatted 36
      # of 52 files. A gate that only exists on developer machines is a gate that
      # does not exist, so it runs here too, where it cannot be bypassed.
      #
      # flake8 runs from the service directory so it picks up setup.cfg, which
      # documents why E203/W503/E501 are off and why E402 is scoped per file.
      # requirements-dev.txt pins the black/flake8 versions the committed
      # formatting was actually generated by — a different black disagrees with
      # this tree and would go red on arrival.
      - name: Lint (ml-service) — black + flake8, hard gate
        run: cd services/ml-service && python3 -m black --check . && python3 -m flake8

      # Full hard gate — nothing is deselected. Both #428 defects are closed:
      # Defect 2 (model artifact pickled under a numpy the pin cannot load) was
      # fixed in PR #430 and its 3 tests run again; Defect 1 (11 tests patching
      # a call_decision_engine that does not exist, on a worker that is not on
      # the live decision path — no producer feeds its queue and it is never
      # started) was RETIRED, not fixed. See
      # docs/adr/ADR-004-underwriting-worker-not-the-decision-path.md.
      #
      # Do not force this green by adding continue-on-error or re-introducing
      # --deselect. Red here means something actually regressed.
      - name: Unit tests (ml-service) — full suite, hard gate, nothing deselected
        run: cd services/ml-service && python -m pytest

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: public-v2/package-lock.json

      - name: Install frontend deps
        run: cd public-v2 && npm ci --legacy-peer-deps

      - name: Lint
        run: cd public-v2 && npm run lint

      - name: Unit tests (Vitest)
        run: cd public-v2 && npm test

      - name: Typecheck + Build
        run: cd public-v2 && npm run build

  registry-ledger:
    name: Registry & Ledger (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vida_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            db/registry/package-lock.json
            services/registry-service/package-lock.json

      - name: Install migration tool deps
        run: cd db/registry && npm ci

      - name: Run migrations against ephemeral Postgres
        run: cd db/registry && npm run migrate:up
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vida_registry_test

      - name: Install registry-service deps
        run: cd services/registry-service && npm ci

      - name: Test (hash-chain, resolver, identity endpoints)
        run: cd services/registry-service && npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vida_registry_test

  firestore-rules:
    name: "Security Rules Tests (Firestore + Storage emulator, HARD gate)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root deps (jest, ts-jest, @firebase/rules-unit-testing)
        run: npm ci

      # The Firestore emulator is a Java process. firebase-tools dropped support
      # for JDK versions before 21 and the ubuntu-latest default is older, so
      # without this the emulator refuses to start and this gate fails for a
      # reason that has nothing to do with the rules.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # HARD gate as of 2026-08-02. This was soft while two real firestore.rules
      # bugs failed (loan and employer delete permitted for ops despite the
      # tests — and the rules' own comments — requiring deny). Both are fixed
      # (#385) and the suite is 92/92. These rules are the last line of defence
      # on tenant isolation and on the loan audit trail, so a regression here
      # must block the merge rather than show green with a red log.
      # storage joined the emulator list on 2026-08-04 with storage.rules.test.ts.
      # storage.rules had guarded employer KYC docs, borrower identity documents,
      # signed contracts and payroll CSVs with no test of any kind, which is how
      # onboarding/employer_signup/* kept an anonymous-write grant. Starting only
      # the firestore emulator here would let that suite fail to connect rather
      # than fail on the rules, so both emulators come up together.
      - name: Rules tests (Firestore + Storage emulators)
        run: firebase emulators:exec --only firestore,storage --project demo-vida-finance-test "npm run test:rules"

  loan-flow-e2e:
    name: "Loan Flow E2E (emulator, HARD gate)"
    runs-on: ubuntu-latest
    # requestLoan enforces its rate limit fail-CLOSED: that limit is the only
    # brake on loan spam, so a limiter that cannot answer refuses the request
    # rather than waving it through. getRedis() throws outright when REDIS_URL
    # is unset, so without a Redis here every case in this suite dies on
    # "Servicio no disponible temporalmente" — which is what happened, and it
    # masked the P0-1/P0-2 assertions rather than failing on them.
    #
    # Giving the job a real Redis instead of stubbing the limiter is
    # deliberate: this is the one suite that proves a borrower can actually
    # get a loan, so it should exercise the same limiter the deployed handler
    # does. Mocking it here would leave the fail-closed path — the thing most
    # able to take loans down in production — untested.
    #
    # Safe against the 3-per-86400s per-uid loan limit because every case
    # seeds its own borrower uid (employee-term-<n>, employee-fee-seed, ...),
    # so no uid issues more than one request.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root deps (jest, ts-jest)
        run: npm ci

      # tests/e2e/jest.emulator.config.js resolves firebase-admin,
      # firebase-functions and friends out of functions/node_modules, because
      # the suite imports functions/src/index.ts directly. Without this install
      # the suite cannot resolve its own jest.mock() targets.
      - name: Install functions deps (resolved by the e2e jest config)
        run: cd functions && npm ci

      # Same JDK-21 constraint as the rules job above — the Firestore emulator
      # is a Java process and firebase-tools dropped pre-21 support.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Added with #427. This is the only suite that proves a borrower can
      # actually get a loan: it runs the deployed requestLoan/getLoanConfig
      # handlers against a REAL Firestore emulator, stubbing only the Cloud
      # Functions decorator layer. Two P0s shipped through this flow with
      # nothing to catch them — every request throwing "Plazo inválido"
      # (P0-1), and a borrower quoted 8% while charged 30% (P0-2, ADR-002).
      # Hard gate from the start: it was 6/6 green before merge, so unlike
      # the ml-service exclusions there is no known-failing set to carve out.
      # firebase.e2e.json pins the emulator to 8098 to avoid colliding with
      # firebase.json's 8080.
      - name: Loan flow E2E (Firestore emulator)
        env:
          REDIS_URL: redis://localhost:6379
        run: firebase emulators:exec --only firestore --config firebase.e2e.json --project demo-vida-finance-test "npm run test:e2e:loan-flow"

  # ─────────────────────────────────────────────────────────────────────
  # Addresses #376: deploy.yml's deploy-firebase job carries
  # `if: github.event_name == 'push'`, so it never runs on PR CI — a PR
  # can go fully green and still be undeployable. This job runs on every
  # push AND pull_request and is credential-free (no Firebase auth), so
  # it is safe to run pre-merge without the staging-IAM decision that
  # Albert's comment on #376 explicitly parked pending Isaac's ruling.
  #
  # What it catches: functions that fail to compile, and drift between
  # what functions/src/index.ts exports and the FUNCTIONS list deploy.yml
  # deploys one-by-one (a function silently missing from one or the other
  # currently breaks or no-ops the deploy, undetected until after merge).
  #
  # Trigger-type changes (HTTPS -> event-trigger etc.) — the actual root
  # cause of the onContactCreated failure — are covered by the warn-only
  # step at the end of this job, which diffs trigger kinds resolved from
  # SOURCE at the merge-base against HEAD.
  #
  # An earlier note here claimed that catching trigger-type changes
  # "requires diffing against the live deployed function via the Firebase
  # API". That conflated two different questions. Asking "what is
  # deployed right now?" does need the API and staging-scoped
  # credentials. Asking "does this PR change a trigger kind?" is pure
  # static comparison of two revisions and needs neither.
  #
  # RESIDUAL RISK, restated accurately: only the second question is
  # answered here. Drift between the repo and what is actually deployed
  # is still invisible, and that is still the "fuller option" in #376 —
  # explicitly parked ("no CI changes until ratified" — Albert,
  # 2026-08-02) pending an IAM decision from Isaac. Consequently this
  # does NOT retroactively flag onContactCreated, whose change is already
  # in the base revision; that one still needs an operator
  # delete-then-recreate.
  # ─────────────────────────────────────────────────────────────────────
  deploy-readiness:
    name: "Deploy Readiness Check (build + export drift, no credentials) — #376"
    runs-on: ubuntu-latest
    steps:
      # Full history: the trigger-kind step below diffs against the merge-base
      # with main, which the default depth-1 checkout cannot resolve.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Build Cloud Functions (the exact artifact deploy.yml ships)
        run: cd functions && npm run build

      - name: Check functions/src/index.ts exports match deploy.yml's FUNCTIONS list
        run: |
          node <<'NODE'
          const fs = require('fs');

          const indexSrc = fs.readFileSync('functions/src/index.ts', 'utf8');
          const deployYml = fs.readFileSync('.github/workflows/deploy.yml', 'utf8');

          const exported = new Set();
          for (const m of indexSrc.matchAll(/export\s+(?:const|function|async function)\s+([A-Za-z0-9_]+)/g)) {
            exported.add(m[1]);
          }
          for (const m of indexSrc.matchAll(/export\s*\{([^}]+)\}\s*from/g)) {
            for (let part of m[1].split(',')) {
              part = part.trim();
              if (!part) continue;
              if (part.includes(' as ')) part = part.split(' as ')[1].trim();
              exported.add(part);
            }
          }

          const listMatch = deployYml.match(/FUNCTIONS="\n([\s\S]*?)\n\s*"/);
          if (!listMatch) {
            console.error('Could not locate the FUNCTIONS list in deploy.yml — update this check if that format changed.');
            process.exit(1);
          }
          const deployed = new Set(listMatch[1].split(/\s+/).filter(Boolean));

          // Dev/test-only exports that are intentionally never deployed.
          const KNOWN_UNDEPLOYED = new Set(['autoVerifyTestAccounts']);

          const missingFromDeploy = [...exported].filter((f) => !deployed.has(f) && !KNOWN_UNDEPLOYED.has(f));
          const missingFromExports = [...deployed].filter((f) => !exported.has(f));

          if (missingFromDeploy.length || missingFromExports.length) {
            if (missingFromDeploy.length) {
              console.error(
                'Exported from functions/src/index.ts but NOT in deploy.yml FUNCTIONS list ' +
                '(will silently never deploy):', missingFromDeploy.join(', ')
              );
            }
            if (missingFromExports.length) {
              console.error(
                'Listed in deploy.yml FUNCTIONS but NOT exported from functions/src/index.ts ' +
                '(will fail deploy-firebase on main):', missingFromExports.join(', ')
              );
            }
            process.exit(1);
          }
          console.log(
            `OK: ${deployed.size} deployed functions match index.ts exports ` +
            `(${KNOWN_UNDEPLOYED.size} dev-only export(s) excluded).`
          );
          NODE

      # Closes the residual risk described above. Firebase cannot converge a
      # change of trigger TYPE in place — that is what actually broke
      # onContactCreated. The step above compares export NAMES, and the name
      # never changed, so it saw nothing.
      #
      # This compares trigger kinds resolved from SOURCE at the merge-base and
      # at HEAD. No Firebase API, no credentials, no network — so it does not
      # depend on the staging-IAM decision that remains parked, for the same
      # reason this whole job was admitted.
      #
      # It therefore catches a trigger-kind change AT THE PR THAT INTRODUCES
      # IT. It does NOT flag onContactCreated today: that change is already in
      # the base revision, so a base-vs-head diff correctly sees no change. The
      # already-deployed onContactCreated still needs an operator
      # delete-then-recreate — this only stops the next one.
      #
      # WARN-ONLY, deliberately: #376 asks for non-blocking until confidence is
      # built. Note the export-drift step above DOES hard-fail; the two
      # behaviours are intentionally different. Do not "tidy" them into one.
      - name: Warn on trigger-type changes (non-blocking)
        run: |
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const { buildTriggerMap, diffTriggerMaps, formatTriggerDiff } =
            require('./functions/lib/deploy/triggerMap.js');

          function baseSha() {
            try {
              return execFileSync('git', ['merge-base', 'HEAD', 'origin/main'], {
                encoding: 'utf8',
              }).trim();
            } catch {
              return null;
            }
          }

          const base = baseSha();
          if (!base) {
            console.log('No merge-base with origin/main resolvable — skipping.');
            process.exit(0);
          }

          const headRead = (p) => {
            try { return fs.readFileSync(p, 'utf8'); } catch { return null; }
          };
          const baseRead = (p) => {
            try {
              return execFileSync('git', ['show', `${base}:${p}`], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              });
            } catch { return null; }
          };

          const diff = diffTriggerMaps(buildTriggerMap(baseRead), buildTriggerMap(headRead));
          const report = formatTriggerDiff(diff);

          if (!report) {
            console.log(`OK: no trigger-type changes vs ${base.slice(0, 8)}.`);
            if (diff.added.length) {
              console.log('New functions (deploy normally): ' +
                diff.added.map((a) => `${a.name} (${a.kind})`).join(', '));
            }
            process.exit(0);
          }

          console.log(report);
          for (const c of diff.changed) {
            console.log(
              `::warning file=functions/src/index.ts::${c.name} changed trigger type ` +
              `${c.from} -> ${c.to}. Firebase cannot converge this in place — delete the ` +
              `function before deploying, or the deploy will fail silently (#376).`
            );
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `### ⚠️ Trigger-type change detected (#376)\n\n${report}\n`
            );
          }
          // Warn-only by design. Do not change to a non-zero exit without
          // ratifying it on #376 first.
          process.exit(0);
          NODE

  health-check:
    name: Verify production endpoints
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm install
      - run: npm run verify
        env:
          # CI mode falls back to known public Railway URLs and skips
          # env-var-only checks so the job stays green when repo secrets
          # aren't configured. Run locally with functions/.env for the
          # full launch-readiness gate.
          VERIFY_MODE: ci
          PAYMENT_SERVER_URL: ${{ secrets.PAYMENT_SERVER_URL }}
          SOFTCREDITO_ADAPTER_URL: ${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          NOTIFICATION_SERVICE_URL: ${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL: ${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL }}
