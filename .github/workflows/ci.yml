name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: '**/package-lock.json'

      - name: Install root deps (includes ESLint)
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: TypeScript typecheck (functions)
        run: cd functions && npm run typecheck

      - name: Lint (functions)
        run: cd functions && npm run lint

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: public-v2/package-lock.json

      - name: Install frontend deps
        run: cd public-v2 && npm ci --legacy-peer-deps

      - name: Lint
        run: cd public-v2 && npm run lint

      - name: Typecheck + Build
        run: cd public-v2 && npm run build

  health-check:
    name: Verify production endpoints
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run verify
        env:
          PAYMENT_SERVER_URL: ${{ secrets.PAYMENT_SERVER_URL }}
          SOFTCREDITO_ADAPTER_URL: ${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          NOTIFICATION_SERVICE_URL: ${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL: ${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL }}
        continue-on-error: true
