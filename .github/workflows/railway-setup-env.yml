name: Setup Railway Environment Variables

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to configure (leave empty to configure all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - payment-server
          - softcredito-adapter
          - notification-service
          - pdf-generator
          - ml-service
      redis_url:
        description: "Redis private URL (default: redis://Redis.railway.internal:6379)"
        required: false
        default: "redis://Redis.railway.internal:6379"

jobs:
  setup-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli

      - name: Resolve Railway token
        run: |
          TOKEN="${{ secrets.RAILWAY_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.RAILWAY_API_TOKEN }}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN secret is not set in this repository."
            echo "Add it under Settings → Secrets → Actions → RAILWAY_TOKEN"
            exit 1
          fi
          echo "RAILWAY_TOKEN=$TOKEN" >> $GITHUB_ENV
          REDIS="${{ github.event.inputs.redis_url }}"
          if [ -z "$REDIS" ]; then
            REDIS="redis://Redis.railway.internal:6379"
          fi
          echo "REDIS_URL=$REDIS" >> $GITHUB_ENV
          railway link --projectId "1ad040b4-6f0b-4530-9f58-0a1ef5e89c75" --environment production

      - name: Set env vars — payment-server
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'payment-server' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          CONEKTA_WEBHOOK_SECRET:       ${{ secrets.CONEKTA_WEBHOOK_SECRET }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3001 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            CONEKTA_WEBHOOK_SECRET="$CONEKTA_WEBHOOK_SECRET" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            ALLOWED_ORIGINS="https://vida-staging.web.app,https://admin-staging.vida.com" \
            SOFTCREDITO_ADAPTER_URL="http://softcredito-adapter.railway.internal:3002" \
            NOTIFICATION_SERVICE_URL="http://notification-service.railway.internal:3003" \
            ML_SERVICE_URL="http://ml-service.railway.internal:3005" \
            --service payment-server
          echo "✅ payment-server environment variables set"

      - name: Set env vars — softcredito-adapter
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'softcredito-adapter' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          SOFTCREDITO_CLIENT_ID:         ${{ secrets.SOFTCREDITO_CLIENT_ID }}
          SOFTCREDITO_CLIENT_SECRET:     ${{ secrets.SOFTCREDITO_CLIENT_SECRET }}
          INTERNAL_SECRET:               ${{ secrets.INTERNAL_SECRET }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3002 \
            REDIS_URL="$REDIS_URL" \
            REDIS_CACHE_TTL=86400 \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            SOFTCREDITO_API_URL="https://api.softcredito.com.mx/v1" \
            SOFTCREDITO_CLIENT_ID="$SOFTCREDITO_CLIENT_ID" \
            SOFTCREDITO_CLIENT_SECRET="$SOFTCREDITO_CLIENT_SECRET" \
            PAYMENT_SERVER_URL="http://payment-server.railway.internal:3001" \
            --service softcredito-adapter
          echo "✅ softcredito-adapter environment variables set"

      - name: Set env vars — notification-service
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'notification-service' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          TWILIO_ACCOUNT_SID:           ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:            ${{ secrets.TWILIO_AUTH_TOKEN }}
          SENDGRID_API_KEY:             ${{ secrets.SENDGRID_API_KEY }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3003 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            TWILIO_ACCOUNT_SID="$TWILIO_ACCOUNT_SID" \
            TWILIO_AUTH_TOKEN="$TWILIO_AUTH_TOKEN" \
            TWILIO_WHATSAPP_FROM="+14155238886" \
            TWILIO_SMS_FROM="+15551234557" \
            SENDGRID_API_KEY="$SENDGRID_API_KEY" \
            SENDGRID_FROM_EMAIL="noreply@vida.finance" \
            SENDGRID_FROM_NAME="VIDA Finance" \
            --service notification-service
          echo "✅ notification-service environment variables set"

      - name: Set env vars — pdf-generator
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'pdf-generator' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          MIFIEL_APP_ID:                ${{ secrets.MIFIEL_APP_ID }}
          MIFIEL_APP_SECRET:            ${{ secrets.MIFIEL_APP_SECRET }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3004 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            FIREBASE_STORAGE_BUCKET="vida-finance-staging.appspot.com" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            PDF_STORAGE_PATH="documents/" \
            MAX_CONCURRENT_PDF_JOBS=3 \
            SOFOM_RFC="VIDA240101XXX" \
            SOFOM_ADDRESS="Paseo de la Reforma 250 Piso 12, CDMX" \
            MIFIEL_APP_ID="$MIFIEL_APP_ID" \
            MIFIEL_APP_SECRET="$MIFIEL_APP_SECRET" \
            MIFIEL_ENV="sandbox" \
            --service pdf-generator
          echo "✅ pdf-generator environment variables set"

      - name: Set env vars — ml-service
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'ml-service' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
        run: |
          railway variables set \
            PORT=3005 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            MODEL_PATH="models/underwriting_v1.joblib" \
            USE_ML_MODELS="false" \
            ML_CACHE_TTL=86400 \
            --service ml-service
          echo "✅ ml-service environment variables set"

      - name: Summary
        run: |
          echo "✅ Railway environment variables setup complete!"
          echo ""
          echo "Services configured (project: observant-miracle):"
          echo "  - payment-server       (port 3001)"
          echo "  - softcredito-adapter  (port 3002)"
          echo "  - notification-service (port 3003)"
          echo "  - pdf-generator        (port 3004)"
          echo "  - ml-service           (port 3005)"
          echo ""
          echo "Next: trigger a deployment to pick up new variables."
          echo "  Go to Actions → Deploy Railway Services → Run workflow → service: all"
