name: Setup Railway Environment Variables

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to configure (leave empty to configure all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - vida-payment-server
          - vida-softcredito
          - vida-notifications
          - vida-pdf-generator
          - vida-ml-service
          - vida-underwriting
      redis_url:
        description: "Redis private URL (default: redis://vida-redis.railway.internal:6379)"
        required: false
        default: "redis://vida-redis.railway.internal:6379"

jobs:
  setup-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: npm install -g @railway/cli

      # Every `railway variables set` below writes STAGING values, hardcoded and
      # unconditional: NODE_ENV=staging and FIREBASE_PROJECT_ID=
      # "vida-finance-staging" on all six services. The token therefore has to
      # be the staging one, but this step used to reach for RAILWAY_TOKEN first
      # and only fall back to RAILWAY_API_TOKEN — RAILWAY_TOKEN_STAGING exists
      # in this repository and was never consulted. If RAILWAY_TOKEN points at
      # the production project, a dispatch pointed production's services at the
      # staging Firebase project and flipped NODE_ENV under them.
      #
      # Staging token first, then the previous chain unchanged so this stays
      # non-breaking if RAILWAY_TOKEN_STAGING is ever removed. The resolved
      # source is echoed (its NAME, never its value) because "which project did
      # this run just write to" should not require reading the workflow file.
      - name: Resolve Railway token
        run: |
          TOKEN="${{ secrets.RAILWAY_TOKEN_STAGING }}"
          SOURCE="RAILWAY_TOKEN_STAGING"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.RAILWAY_TOKEN }}"
            SOURCE="RAILWAY_TOKEN"
            echo "⚠️  RAILWAY_TOKEN_STAGING is empty; falling back to RAILWAY_TOKEN."
            echo "    This workflow writes staging-only values — confirm that token"
            echo "    targets the staging project before trusting this run."
          fi
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.RAILWAY_API_TOKEN }}"
            SOURCE="RAILWAY_API_TOKEN"
          fi
          if [ -z "$TOKEN" ]; then
            echo "❌ No Railway token is set in this repository."
            echo "Add RAILWAY_TOKEN_STAGING under Settings → Secrets → Actions"
            exit 1
          fi
          echo "Railway token resolved from: $SOURCE"
          echo "RAILWAY_TOKEN=$TOKEN" >> $GITHUB_ENV
          REDIS="${{ github.event.inputs.redis_url }}"
          if [ -z "$REDIS" ]; then
            REDIS="redis://vida-redis.railway.internal:6379"
          fi
          echo "REDIS_URL=$REDIS" >> $GITHUB_ENV

      # `railway variables set X=""` does not skip X — it OVERWRITES X with an
      # empty string on the live service. GitHub Actions substitutes an empty
      # string for a secret that does not exist, with no warning and no
      # workflow error, so a secret this file references but that was never
      # created silently erases a working value the moment anyone dispatches
      # this workflow. Same defect class as #548, one layer out: #548 fixed the
      # functions/.env write, this is the Railway service write.
      #
      # As of this commit, 9 of the 21 secrets referenced below do not exist in
      # this repository. The one that matters most is CONEKTA_WEBHOOK_SECRET:
      # payment-server's /webhooks/conekta handler fails CLOSED on an empty key
      # (services/payment-server/index.js:166), by deliberate design, because an
      # empty HMAC key is one the caller can derive too. So pushing an empty
      # value makes every Conekta card webhook 401 — `order.paid` and
      # `charge.paid` both stop arriving, applyCardRepayment never runs, and
      # borrowers' card repayments silently stop settling. The money-in path
      # turns off, and nothing alerts, because SLACK_WEBHOOK_URL and
      # PAGERDUTY_ROUTING_KEY are two of the other eight missing secrets.
      #
      # REQUIRED = pushing it empty breaks a live flow. Validated here, before
      # the first `railway variables set` runs, so a misconfigured dispatch
      # fails without touching any service. Optional-but-absent secrets are
      # listed as a warning rather than a failure, since several are genuinely
      # unused today. Key NAMES only — never values, never `env | grep`.
      - name: Validate required secrets resolve non-empty
        env:
          CONEKTA_WEBHOOK_SECRET: ${{ secrets.CONEKTA_WEBHOOK_SECRET }}
          INTERNAL_SECRET:        ${{ secrets.INTERNAL_SECRET }}
          SENDGRID_API_KEY:       ${{ secrets.SENDGRID_API_KEY }}
          TWILIO_ACCOUNT_SID:     ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:      ${{ secrets.TWILIO_AUTH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY:  ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          MIFIEL_APP_ID:          ${{ secrets.MIFIEL_APP_ID }}
          MIFIEL_APP_SECRET:      ${{ secrets.MIFIEL_APP_SECRET }}
          VERIFIK_API_KEY:        ${{ secrets.VERIFIK_API_KEY }}
          SW_USER:                ${{ secrets.SW_USER }}
          SW_PASSWORD:            ${{ secrets.SW_PASSWORD }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -u
          # No -x: a trace would print secret values into the job log.
          REQUIRED="CONEKTA_WEBHOOK_SECRET INTERNAL_SECRET SENDGRID_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN FIREBASE_SERVICE_ACCOUNT_B64"
          OPTIONAL="SLACK_WEBHOOK_URL PAGERDUTY_ROUTING_KEY MIFIEL_APP_ID MIFIEL_APP_SECRET VERIFIK_API_KEY SW_USER SW_PASSWORD ANTHROPIC_API_KEY"

          MISSING=""
          for key in $REQUIRED; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              MISSING="$MISSING $key"
            fi
          done

          ABSENT=""
          for key in $OPTIONAL; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              ABSENT="$ABSENT $key"
            fi
          done

          if [ -n "$ABSENT" ]; then
            echo "⚠️  Optional secrets are empty and WILL be written as empty strings,"
            echo "    overwriting whatever those services currently hold:"
            for key in $ABSENT; do echo "      - $key"; done
          fi

          if [ -n "$MISSING" ]; then
            echo ""
            echo "❌ Refusing to run: these REQUIRED secrets resolve empty."
            for key in $MISSING; do echo "      - $key"; done
            echo ""
            echo "Writing them would overwrite live Railway values with empty strings."
            echo "Create each under Settings → Secrets and variables → Actions,"
            echo "then re-dispatch. No service has been modified by this run."
            exit 1
          fi

          echo "✅ All required secrets resolve non-empty."

      - name: Set env vars — vida-payment-server
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'vida-payment-server' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          CONEKTA_WEBHOOK_SECRET:       ${{ secrets.CONEKTA_WEBHOOK_SECRET }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY:        ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3001 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            CONEKTA_WEBHOOK_SECRET="$CONEKTA_WEBHOOK_SECRET" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            ALLOWED_ORIGINS="https://vida-staging.web.app,https://admin-staging.vida.com" \
            SOFTCREDITO_ADAPTER_URL="http://vida-softcredito.railway.internal:3002" \
            NOTIFICATION_SERVICE_URL="http://vida-notifications.railway.internal:3003" \
            ML_SERVICE_URL="http://vida-ml-service.railway.internal:3005" \
            SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            PAGERDUTY_ROUTING_KEY="$PAGERDUTY_ROUTING_KEY" \
            --service payment-server
          echo "✅ vida-payment-server environment variables set"

      - name: Set env vars — vida-softcredito
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'vida-softcredito' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          SOFTCREDITO_CLIENT_ID:         ${{ secrets.SOFTCREDITO_CLIENT_ID }}
          SOFTCREDITO_CLIENT_SECRET:     ${{ secrets.SOFTCREDITO_CLIENT_SECRET }}
          INTERNAL_SECRET:               ${{ secrets.INTERNAL_SECRET }}
          SLACK_WEBHOOK_URL:             ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY:         ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3002 \
            REDIS_URL="$REDIS_URL" \
            REDIS_CACHE_TTL=86400 \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            SOFTCREDITO_API_URL="https://api.softcredito.com.mx/v1" \
            SOFTCREDITO_CLIENT_ID="$SOFTCREDITO_CLIENT_ID" \
            SOFTCREDITO_CLIENT_SECRET="$SOFTCREDITO_CLIENT_SECRET" \
            PAYMENT_SERVER_URL="http://vida-payment-server.railway.internal:3001" \
            SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            PAGERDUTY_ROUTING_KEY="$PAGERDUTY_ROUTING_KEY" \
            --service softcredito-adapter
          echo "✅ vida-softcredito environment variables set"

      - name: Set env vars — vida-notifications
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'vida-notifications' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          TWILIO_ACCOUNT_SID:           ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:            ${{ secrets.TWILIO_AUTH_TOKEN }}
          SENDGRID_API_KEY:             ${{ secrets.SENDGRID_API_KEY }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY:        ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3003 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            TWILIO_ACCOUNT_SID="$TWILIO_ACCOUNT_SID" \
            TWILIO_AUTH_TOKEN="$TWILIO_AUTH_TOKEN" \
            TWILIO_WHATSAPP_FROM="+14155238886" \
            TWILIO_SMS_FROM="+15551234567" \
            SENDGRID_API_KEY="$SENDGRID_API_KEY" \
            SENDGRID_FROM_EMAIL="noreply@vida.finance" \
            SENDGRID_FROM_NAME="VIDA Finance" \
            SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            PAGERDUTY_ROUTING_KEY="$PAGERDUTY_ROUTING_KEY" \
            --service notification-service
          echo "✅ vida-notifications environment variables set"

      - name: Set env vars — vida-pdf-generator
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'vida-pdf-generator' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          MIFIEL_APP_ID:                ${{ secrets.MIFIEL_APP_ID }}
          MIFIEL_APP_SECRET:            ${{ secrets.MIFIEL_APP_SECRET }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY:        ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3004 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            FIREBASE_STORAGE_BUCKET="vida-finance-staging.appspot.com" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            PDF_STORAGE_PATH="documents/" \
            MAX_CONCURRENT_PDF_JOBS=3 \
            SOFOM_RFC="VIDA240101XXX" \
            SOFOM_ADDRESS="Paseo de la Reforma 250 Piso 12, CDMX" \
            MIFIEL_APP_ID="$MIFIEL_APP_ID" \
            MIFIEL_APP_SECRET="$MIFIEL_APP_SECRET" \
            MIFIEL_ENV="sandbox" \
            SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            PAGERDUTY_ROUTING_KEY="$PAGERDUTY_ROUTING_KEY" \
            --service pdf-generator
          echo "✅ vida-pdf-generator environment variables set"

      - name: Set env vars — vida-ml-service
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'vida-ml-service' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY:        ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          railway variables set \
            PORT=3005 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_PROJECT_ID="vida-finance-staging" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            MODEL_PATH="models/underwriting_v1.joblib" \
            USE_ML_MODELS="false" \
            ML_MODE="manual_review_all" \
            ML_CACHE_TTL=86400 \
            SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            PAGERDUTY_ROUTING_KEY="$PAGERDUTY_ROUTING_KEY" \
            --service ml-service
          echo "✅ vida-ml-service environment variables set"

      - name: Set env vars — vida-underwriting
        if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'vida-underwriting' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          INTERNAL_SECRET:              ${{ secrets.INTERNAL_SECRET }}
          VERIFIK_API_KEY:              ${{ secrets.VERIFIK_API_KEY }}
          SW_USER:                      ${{ secrets.SW_USER }}
          SW_PASSWORD:                  ${{ secrets.SW_PASSWORD }}
          BELVO_SECRET_ID:              ${{ secrets.BELVO_SECRET_ID }}
          BELVO_SECRET_PASSWORD:        ${{ secrets.BELVO_SECRET_PASSWORD }}
          RISKSEAL_API_KEY:             ${{ secrets.RISKSEAL_API_KEY }}
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY:        ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          railway variables set \
            NODE_ENV=staging \
            PORT=3003 \
            REDIS_URL="$REDIS_URL" \
            FIREBASE_SERVICE_ACCOUNT_B64="$FIREBASE_SERVICE_ACCOUNT_B64" \
            INTERNAL_SECRET="$INTERNAL_SECRET" \
            ALLOWED_ORIGINS="https://vida-staging.web.app,https://admin-staging.vida.com" \
            VERIFIK_API_KEY="$VERIFIK_API_KEY" \
            VERIFIK_BASE_URL="https://api.verifik.co" \
            SW_USER="$SW_USER" \
            SW_PASSWORD="$SW_PASSWORD" \
            SW_BASE_URL="https://services.sw.com.mx" \
            BELVO_SECRET_ID="$BELVO_SECRET_ID" \
            BELVO_SECRET_PASSWORD="$BELVO_SECRET_PASSWORD" \
            BELVO_BASE_URL="https://sandbox.belvo.com" \
            RISKSEAL_MOCK="false" \
            RISKSEAL_API_KEY="$RISKSEAL_API_KEY" \
            RISKSEAL_BASE_URL="https://latam-1.riskseal.io" \
            GOOGLE_DOCAI_PROJECT_ID="vida-finance" \
            GOOGLE_DOCAI_LOCATION="us" \
            GOOGLE_DOCAI_PROCESSOR_ID="8d46c79a75eb5406" \
            SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            PAGERDUTY_ROUTING_KEY="$PAGERDUTY_ROUTING_KEY" \
            --service underwriting-service
          echo "✅ vida-underwriting environment variables set"

      - name: Summary
        run: |
          echo "✅ Railway environment variables setup complete!"
          echo ""
          echo "Services configured:"
          echo "  - vida-payment-server  (port 3001)"
          echo "  - vida-softcredito     (port 3002)"
          echo "  - vida-notifications   (port 3003)"
          echo "  - vida-pdf-generator   (port 3004)"
          echo "  - vida-ml-service      (port 3005)"
          echo "  - vida-underwriting    (port 3003)"
          echo ""
          echo "Next: trigger a deployment to pick up new variables."
          echo "  Go to Actions → Deploy Railway Services → Run workflow → service: all"
