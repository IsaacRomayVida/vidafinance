name: Deploy underwriting-service (Railway)

# ⚠️ underwriting-service HAS NO RAILWAY DEPLOYMENT TRIGGER. THIS WORKFLOW IS IT.
#
# `underwriting-service` (Railway project `FunPay`, environment `production`) is
# what functions/src/index.ts calls at UNDERWRITING_SERVICE_URL + /underwrite —
# the credit decision. Until 2026-10-16 nothing deployed it on merge: production
# ran `8259bd0` (2026-09-18) while #636's INFONAVIT gate and #639's closed-credit
# rule sat merged and unshipped. Railway's commit statuses on merge commits cover
# ml-service, notification-service, payment-server and pdf-generator only. Same
# gap registry-service-funpay had; see deploy-registry-funpay.yml, which this
# workflow follows step for step, and docs/runbooks/deploy.md §1.2.
#
# It deploys on every push to main that touches the build (the user approved the
# push trigger on 2026-10-16), and can still be dispatched by hand.
#
# Also note recover-production-services.yml redeploys this service if — and only
# if — Railway reports ZERO active deployments for it. That is a self-heal for a
# fully-down service, not a deploy path for new code.
#
# IF A DEPLOYMENT TRIGGER IS EVER ADDED IN THE RAILWAY DASHBOARD, either delete
# this workflow or keep it strictly manual — two builds of one service racing is
# the failure mode the registry workflow's header describes.
#
# After Railway reports SUCCESS, the job reads GET /health and fails unless the
# service reports the commit Railway built. "Deployed" is claimed by the running
# process, not inferred from a status field.

on:
  push:
    branches: [main]
    # This list mirrors the Dockerfile's COPY set, NOT the npm dependency graph.
    # services/underwriting-service/Dockerfile builds from the repo root and
    # copies `services/shared/` as well as its own directory, so a shared-only
    # commit must deploy too. If you change the Dockerfile's COPY set, change
    # this list in the same PR: scripts/check-deploy-watch-paths.mjs re-derives
    # the COPY set and fails CI on an uncovered path.
    paths:
      - 'services/underwriting-service/**'
      - 'services/shared/**'
      - '.dockerignore'
      - '.github/workflows/deploy-underwriting.yml'
  workflow_dispatch: {}

concurrency:
  # Never race two deploys of one service; never cancel one midway (a cancelled
  # run still leaves whatever Railway had already started).
  group: deploy-underwriting
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAILWAY_API: https://backboard.railway.app/graphql/v2
  # FunPay project and its production environment — the same ids
  # deploy-registry-funpay.yml and set-sc-vars.yml use.
  RAILWAY_PROJECT_ID: 1ad040b4-6f0b-4530-9f58-0a1ef5e89c75
  RAILWAY_ENVIRONMENT_ID: 441caff4-8cc1-401f-93e2-30c49fe5d2d9
  # No RAILWAY_SERVICE_ID here: this repo has never recorded the underwriting
  # service's id, and one is not invented. The "Resolve" step finds it at run
  # time — the service serving the canonical host in
  # scripts/production-endpoints.json — and fails closed unless exactly one does
  # AND it carries this name. scripts/check-deploy-watch-paths.mjs reads this
  # key, so it is the only copy.
  RAILWAY_SERVICE_NAME: underwriting-service
  # Must match the TARGETS entry in scripts/check-deploy-watch-paths.mjs.
  EXPECTED_DOCKERFILE: services/underwriting-service/Dockerfile

jobs:
  deploy:
    name: Deploy underwriting-service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      # `latestCommit: true` below deploys the head of the branch Railway links,
      # whatever ref this was dispatched from — but a dispatch from a branch would
      # still run THIS file as that branch has it. Refusing non-main refs stops an
      # accidental dispatch from a feature branch; the production environment's
      # protection rules are what stop a deliberate one.
      - name: Refuse to run from anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatched from ${GITHUB_REF}. Deploy underwriting-service from main only."
            exit 1
          fi

      # For scripts/production-endpoints.json and scripts/deploy-underwriting-checks.mjs.
      # Nothing from the checkout is deployed — Railway builds from its own clone.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Railway answers an auth failure with HTTP 200 and an `{"errors":[...]}`
      # body; `curl -f` reads that as success. Every call goes through this
      # helper, which treats a non-200 AND an error body as failure. Same helper
      # as deploy-registry-funpay.yml — read the comments there.
      - name: Write the Railway API helper
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/railway.sh" <<'SH'
          railway_call() {
            local payload="$1" out="$2" http
            http=$(curl -sS --max-time 60 -o "$out" -w '%{http_code}' \
              "$RAILWAY_API" \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload") || { echo "::error::curl failed talking to Railway"; return 1; }

            if [ "$http" != "200" ]; then
              echo "::error::Railway returned HTTP $http"
              return 1
            fi

            if jq -e 'has("errors")' "$out" >/dev/null 2>&1; then
              local messages
              messages=$(jq -r '[.errors[].message] | join("; ")' "$out")
              echo "::error::Railway returned a GraphQL error body (HTTP 200): ${messages}"

              # Railway answers a nonexistent id with this same message and code,
              # so it is not a reliable statement about the token.
              case "$messages" in
                *"Not Authorized"*)
                  echo "::error::Check the IDs before the token. Railway answers a nonexistent serviceId/environmentId/projectId with this exact message. environmentId=${RAILWAY_ENVIRONMENT_ID} projectId=${RAILWAY_PROJECT_ID} serviceId=${RAILWAY_SERVICE_ID:-<not resolved yet>} — the project and environment ids live in the \`env:\` block of this file; the service id is resolved from scripts/production-endpoints.json on every run."
                  ;;
              esac
              return 1
            fi
          }

          # Retrying wrapper, for reads that happen AFTER the deploy was
          # triggered. A failed read then says nothing about the deploy. Not
          # used before the trigger: a failure there started nothing, so an
          # immediate red is honest and safe to re-run.
          railway_call_retry() {
            local payload="$1" out="$2" attempt=1 max=3 err
            while :; do
              if err=$(railway_call "$payload" "$out" 2>&1); then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "${err#::error::}"
                return 1
              fi
              echo "::warning::Railway status read failed (attempt ${attempt}/${max}), retrying in 10s: ${err#::error::}"
              attempt=$(( attempt + 1 ))
              sleep 10
            done
          }
          SH

      # Find the service rather than trusting a hardcoded id. Every service in
      # the project is listed with its production domains, and
      # scripts/deploy-underwriting-checks.mjs picks the one serving the
      # canonical underwriting host — refusing on zero matches, several, any
      # unreadable domain list, or a name other than RAILWAY_SERVICE_NAME.
      # Nothing has been triggered yet, so any failure here is a clean stop.
      - name: Resolve the underwriting service in FunPay/production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/railway.sh"

          payload=$(jq -n --arg p "$RAILWAY_PROJECT_ID" '{
            query: "query($p: String!) { project(id: $p) { services { edges { node { id name } } } } }",
            variables: { p: $p }
          }')
          railway_call "$payload" "${RUNNER_TEMP}/services.json"

          echo '[]' > "${RUNNER_TEMP}/inventory.json"
          while IFS=$'\t' read -r sid sname; do
            payload=$(jq -n --arg p "$RAILWAY_PROJECT_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" --arg s "$sid" '{
              query: "query($p: String!, $e: String!, $s: String!) { domains(projectId: $p, environmentId: $e, serviceId: $s) { serviceDomains { domain } customDomains { domain } } }",
              variables: { p: $p, e: $e, s: $s }
            }')
            # An unreadable domain list is recorded as null, and the resolver
            # refuses on it rather than skipping the service.
            if railway_call "$payload" "${RUNNER_TEMP}/domains.json"; then
              domains=$(jq -c '[(.data.domains.serviceDomains // [])[], (.data.domains.customDomains // [])[] | .domain | ascii_downcase]' "${RUNNER_TEMP}/domains.json")
            else
              domains=null
            fi
            echo "  ${sname}: ${domains}"
            jq --arg id "$sid" --arg name "$sname" --argjson domains "$domains" \
              '. + [{ id: $id, name: $name, domains: $domains }]' \
              "${RUNNER_TEMP}/inventory.json" > "${RUNNER_TEMP}/inventory.next.json"
            mv "${RUNNER_TEMP}/inventory.next.json" "${RUNNER_TEMP}/inventory.json"
          done < <(jq -r '.data.project.services.edges[].node | [.id, .name] | @tsv' "${RUNNER_TEMP}/services.json")

          service_id=$(node scripts/deploy-underwriting-checks.mjs resolve \
            "${RUNNER_TEMP}/inventory.json" scripts/production-endpoints.json "$RAILWAY_SERVICE_NAME")

          base_url=$(jq -r '.services["underwriting-service"]' scripts/production-endpoints.json)
          echo "RAILWAY_SERVICE_ID=${service_id}" >> "$GITHUB_ENV"
          echo "HEALTH_URL=${base_url%/}/health" >> "$GITHUB_ENV"
          echo "✓ ${RAILWAY_SERVICE_NAME} is ${service_id}, serving ${base_url}"

      # The half of scripts/check-deploy-watch-paths.mjs that needs credentials:
      # the service must still be built from EXPECTED_DOCKERFILE with a
      # repo-root context and no Railway config file. Fail-closed for the same
      # reasons as in deploy-registry-funpay.yml — and so that when a push
      # trigger is approved, the paths filter is derived from the real build.
      - name: Confirm Railway still builds this service from its Dockerfile
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/railway.sh"

          payload=$(jq -n --arg id "$RAILWAY_SERVICE_ID" '{
            query: "query($id: String!) { service(id: $id) { serviceInstances { edges { node { environmentId railwayConfigFile rootDirectory } } } } }",
            variables: { id: $id }
          }')
          railway_call "$payload" "${RUNNER_TEMP}/instance.json"

          node_json=$(jq -c --arg e "$RAILWAY_ENVIRONMENT_ID" \
            '[.data.service.serviceInstances.edges[].node | select(.environmentId == $e)][0] // {}' \
            "${RUNNER_TEMP}/instance.json")

          config_file=$(printf '%s' "$node_json" | jq -r '.railwayConfigFile // "null"')
          root_dir=$(printf '%s' "$node_json" | jq -r '.rootDirectory // ""')

          if [ "$config_file" != "null" ]; then
            echo "::error::railwayConfigFile is now \"${config_file}\", not null. A Railway config file can redefine the builder, so ${EXPECTED_DOCKERFILE} is no longer the whole build. Re-derive scripts/check-deploy-watch-paths.mjs before deploying."
            exit 1
          fi

          if [ -n "$root_dir" ] && [ "$root_dir" != "/" ]; then
            echo "::error::rootDirectory is now \"${root_dir}\". ${EXPECTED_DOCKERFILE} is written against a repo-root build context."
            exit 1
          fi

          # NOTE: this response contains EVERY service variable, including
          # INTERNAL_SECRET and the Firebase service account. Written to a file,
          # read with jq, removed on exit. Never cat or echo it. Only the
          # Dockerfile path — not a secret — is printed.
          payload=$(jq -n \
            --arg p "$RAILWAY_PROJECT_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" --arg s "$RAILWAY_SERVICE_ID" '{
              query: "query($p: String!, $e: String!, $s: String!) { variables(projectId: $p, environmentId: $e, serviceId: $s) }",
              variables: { p: $p, e: $e, s: $s }
            }')
          trap 'rm -f "${RUNNER_TEMP}/vars.json"' EXIT
          railway_call "$payload" "${RUNNER_TEMP}/vars.json"

          dockerfile_path=$(jq -r '.data.variables.RAILWAY_DOCKERFILE_PATH // ""' "${RUNNER_TEMP}/vars.json")
          rm -f "${RUNNER_TEMP}/vars.json"

          if [ "$dockerfile_path" != "$EXPECTED_DOCKERFILE" ]; then
            echo "::error::RAILWAY_DOCKERFILE_PATH is \"${dockerfile_path:-<unset>}\", expected \"${EXPECTED_DOCKERFILE}\". Unset, the service builds with Railpack instead, from inputs nothing in this repo checks. Restore the variable (services/underwriting-service/Dockerfile's header names it) or re-derive the checks against whatever now defines the build."
            exit 1
          fi

          echo "✓ Dockerfile build confirmed: RAILWAY_DOCKERFILE_PATH=${dockerfile_path}, railwayConfigFile=null, repo-root context"

      - name: Record the deployment that is live before we trigger
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/railway.sh"

          payload=$(jq -n \
            --arg p "$RAILWAY_PROJECT_ID" --arg s "$RAILWAY_SERVICE_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" '{
              query: "query($input: DeploymentListInput!) { deployments(first: 1, input: $input) { edges { node { id status createdAt meta } } } }",
              variables: { input: { projectId: $p, serviceId: $s, environmentId: $e } }
            }')

          railway_call "$payload" "${RUNNER_TEMP}/before.json"

          before_id=$(jq -r '.data.deployments.edges[0].node.id // ""' "${RUNNER_TEMP}/before.json")
          before_status=$(jq -r '.data.deployments.edges[0].node.status // "none"' "${RUNNER_TEMP}/before.json")
          before_commit=$(jq -r '.data.deployments.edges[0].node.meta.commitHash // "unknown"' "${RUNNER_TEMP}/before.json")

          # The wait below keys on the deployment id CHANGING. Asking "is the
          # latest deployment green?" would read this one and pass at once.
          echo "BEFORE_DEPLOYMENT_ID=${before_id}" >> "$GITHUB_ENV"
          echo "BEFORE_DEPLOYMENT_COMMIT=${before_commit}" >> "$GITHUB_ENV"
          echo "Currently live: ${before_id:-<none>} (${before_status}, commit ${before_commit:0:8})"

      - name: Trigger the deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/railway.sh"

          # `latestCommit: true`, not `commitSha: $GITHUB_SHA`: it always resolves
          # to the head of the branch Railway links, so no dispatch can ship
          # unmerged code. Account token over GraphQL, not the Railway CLI — same
          # reasoning as deploy-registry-funpay.yml.
          payload=$(jq -n \
            --arg s "$RAILWAY_SERVICE_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" '{
              query: "mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeploy(serviceId: $serviceId, environmentId: $environmentId, latestCommit: true) }",
              variables: { serviceId: $s, environmentId: $e }
            }')

          railway_call "$payload" "${RUNNER_TEMP}/deploy.json"

          if ! jq -e '.data.serviceInstanceDeploy == true' "${RUNNER_TEMP}/deploy.json" >/dev/null; then
            echo "::error::serviceInstanceDeploy did not return true: $(jq -c '.data' "${RUNNER_TEMP}/deploy.json")"
            exit 1
          fi

          echo "✓ Deploy accepted by Railway (serviceInstanceDeploy: true)"

      - name: Wait for the new deployment to reach a terminal state
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/railway.sh"

          payload=$(jq -n \
            --arg p "$RAILWAY_PROJECT_ID" --arg s "$RAILWAY_SERVICE_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" '{
              query: "query($input: DeploymentListInput!) { deployments(first: 1, input: $input) { edges { node { id status createdAt meta } } } }",
              variables: { input: { projectId: $p, serviceId: $s, environmentId: $e } }
            }')

          deadline=$(( $(date +%s) + 600 ))
          last_status="none"
          new_id=""
          reads_ok=0
          read_failures=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            # A failed read after the trigger is a missing observation, not a
            # failed deploy: spend the poll window, not the deploy.
            if ! railway_call_retry "$payload" "${RUNNER_TEMP}/poll.json"; then
              read_failures=$(( read_failures + 1 ))
              echo "::warning::Could not read deployment status (read failure #${read_failures}); the deploy is unaffected and the poll window has time left. Retrying."
              sleep 15
              continue
            fi
            reads_ok=$(( reads_ok + 1 ))

            id=$(jq -r '.data.deployments.edges[0].node.id // ""' "${RUNNER_TEMP}/poll.json")
            status=$(jq -r '.data.deployments.edges[0].node.status // "none"' "${RUNNER_TEMP}/poll.json")
            commit=$(jq -r '.data.deployments.edges[0].node.meta.commitHash // "unknown"' "${RUNNER_TEMP}/poll.json")

            if [ -z "$id" ] || [ "$id" = "$BEFORE_DEPLOYMENT_ID" ]; then
              echo "waiting for the new deployment to appear (still showing ${id:-<none>})"
              sleep 15
              continue
            fi

            if [ -z "$new_id" ]; then
              new_id="$id"
              echo "New deployment: ${new_id} (commit ${commit:0:8})"
              echo "DEPLOYMENT_ID=${new_id}" >> "$GITHUB_ENV"
              echo "DEPLOYMENT_COMMIT=${commit}" >> "$GITHUB_ENV"
            fi

            last_status="$status"
            case "$status" in
              SUCCESS)
                echo "✓ Deployment ${new_id} SUCCESS (commit ${commit:0:8})"
                echo "DEPLOYMENT_STATUS=SUCCESS" >> "$GITHUB_ENV"
                exit 0
                ;;
              # SKIPPED and REMOVED mean this commit is not what is running;
              # NEEDS_APPROVAL never clears unattended.
              FAILED|CRASHED|REMOVED|SKIPPED|NEEDS_APPROVAL)
                echo "::error::Deployment ${new_id} ended ${status} (commit ${commit:0:8}). Railway logs: https://railway.app/project/${RAILWAY_PROJECT_ID}/service/${RAILWAY_SERVICE_ID}"
                exit 1
                ;;
              *)
                echo "  ${status}…"
                sleep 15
                ;;
            esac
          done

          if [ "$reads_ok" -eq 0 ]; then
            echo "::error::Never read deployment status from Railway in 10m (${read_failures} failed reads). The deploy was accepted and MAY HAVE SUCCEEDED — this job never saw it either way. Check Railway before re-running: https://railway.app/project/${RAILWAY_PROJECT_ID}/service/${RAILWAY_SERVICE_ID}"
          else
            echo "::error::Timed out after 10m waiting for deployment ${new_id:-<never appeared>} (last status: ${last_status}; ${read_failures} reads also failed). The deploy may still be running — check Railway before retrying."
          fi
          exit 1

      # Railway's SUCCESS says a container started. This asks the service
      # itself: GET /health must report the commit Railway built (and, when it
      # reports one, the new deployment id). Traffic moves to the new container
      # shortly after SUCCESS, so an old answer is waited out for up to 5
      # minutes; the decision itself is scripts/deploy-underwriting-checks.mjs,
      # which is tested. /health is public and carries no secret.
      - name: Verify /health reports the deployed commit
        run: |
          set -euo pipefail

          deadline=$(( $(date +%s) + 300 ))
          last="no response yet"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -sS --max-time 15 -o "${RUNNER_TEMP}/health.json" "$HEALTH_URL"; then
              set +e
              last=$(node scripts/deploy-underwriting-checks.mjs health \
                "${RUNNER_TEMP}/health.json" "${DEPLOYMENT_COMMIT:-}" "${DEPLOYMENT_ID:-}")
              verdict=$?
              set -e
              echo "  ${last}"
              case "$verdict" in
                0)
                  echo "HEALTH_VERIFIED=yes" >> "$GITHUB_ENV"
                  echo "LIVE_COMMIT=$(jq -r '.commit // "unknown"' "${RUNNER_TEMP}/health.json")" >> "$GITHUB_ENV"
                  echo "✓ ${HEALTH_URL}: ${last}"
                  exit 0
                  ;;
                1)
                  echo "::error::${HEALTH_URL}: ${last}"
                  exit 1
                  ;;
              esac
            else
              last="${HEALTH_URL} did not answer"
              echo "  ${last}"
            fi
            sleep 15
          done

          echo "::error::Railway reports deployment ${DEPLOYMENT_ID:-?} SUCCESS, but after 5m ${HEALTH_URL} still does not report commit ${DEPLOYMENT_COMMIT:0:8} (last: ${last}). Do not assume the new code is serving."
          exit 1

      # `latestCommit` deploys whatever branch Railway links, which this repo
      # cannot see. When that is not the commit main pointed at when this run
      # was dispatched, say so — a different linked branch, or a merge that
      # landed in between. A warning, not a failure: /health above already
      # proved which commit is live.
      - name: Compare the deployed commit with main
        if: env.DEPLOYMENT_COMMIT != ''
        run: |
          if [ "${DEPLOYMENT_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "::warning::Railway deployed ${DEPLOYMENT_COMMIT:0:8}, but main was ${GITHUB_SHA:0:8} when this run started. Check which branch the service is linked to in Railway."
          else
            echo "✓ Deployed commit is main as of this run (${GITHUB_SHA:0:8})"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## underwriting-service deploy"
            echo ""
            echo "- Railway service: \`${RAILWAY_SERVICE_NAME}\` \`${RAILWAY_SERVICE_ID:-not resolved}\`"
            echo "- Previously live deployment: \`${BEFORE_DEPLOYMENT_ID:-<none>}\` (commit \`${BEFORE_DEPLOYMENT_COMMIT:-unknown}\`)"
            echo "- Deployment waited on: \`${DEPLOYMENT_ID:-not created}\`"
            echo "- Deployed commit (Railway): \`${DEPLOYMENT_COMMIT:-unknown}\`"
            echo "- main when this run started: \`${GITHUB_SHA}\`"
            echo "- Railway result: \`${DEPLOYMENT_STATUS:-FAILED}\`"
            echo "- /health reports: \`${LIVE_COMMIT:-not verified}\`"
            echo ""
            if [ "${HEALTH_VERIFIED:-}" = "yes" ]; then
              echo "✓ The running service reports the deployed commit."
            else
              echo "⚠ Not verified that the running service reports the deployed commit."
            fi
            echo ""
            echo "Triggered by: \`${GITHUB_EVENT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
