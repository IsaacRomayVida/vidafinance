name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            functions/package-lock.json
            public-v2/package-lock.json

      - run: cd functions && npm ci

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install frontend deps
        run: cd public-v2 && npm ci --legacy-peer-deps

      - name: Build frontend (public-v2)
        run: cd public-v2 && npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # NOTE ON SECRET NAMES: these two steps used to reference a
      # "_STAGING"/"_PRODUCTION"-suffixed secret for each of REDIS_URL,
      # SOFTCREDITO_ADAPTER_URL, PAYMENT_SERVER_URL, NOTIFICATION_SERVICE_URL,
      # PDF_GENERATOR_URL, ML_SERVICE_URL and (staging only)
      # REGISTRY_SERVICE_URL — none of those 13 suffixed secrets were
      # ever created in this repo (`gh secret list --repo
      # IsaacRomayVida/vidafinance`). A GitHub secret reference that doesn't
      # exist interpolates to an empty string with no error, so every
      # workflow_dispatch of this workflow (e.g. run 30584991644,
      # 2026-07-30) wrote a functions/.env with those keys blank and reported
      # SUCCESS. The real secrets are the unsuffixed names used below —
      # staging and production deploys now share the same downstream-service
      # URLs for these, because that is the only version of each secret that
      # actually exists.
      - name: Write functions .env (Staging)
        if: inputs.environment == 'staging'
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          REGISTRY_SERVICE_URL=${{ secrets.REGISTRY_SERVICE_URL }}
          # See deploy.yml's METAMAP_WEBHOOK_SECRET comment for the full
          # finding. Short version: read by webhooks/metamap.ts, written by no
          # workflow, so metamapWebhook has been returning 500 to every MetaMap
          # callback. Empty until the secret is provisioned, which preserves
          # today's fail-closed behaviour rather than changing it.
          METAMAP_WEBHOOK_SECRET=${{ secrets.METAMAP_WEBHOOK_SECRET }}
          ENVEOF

      - name: Write functions .env (Production)
        if: inputs.environment == 'production'
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL }}
          REGISTRY_SERVICE_URL=${{ secrets.REGISTRY_SERVICE_URL }}
          # See deploy.yml's METAMAP_WEBHOOK_SECRET comment for the full finding.
          METAMAP_WEBHOOK_SECRET=${{ secrets.METAMAP_WEBHOOK_SECRET }}
          ENVEOF

      # Same required-vs-optional determination as deploy.yml's identical
      # validation step — see that file for the per-key code evidence
      # (functions/src/utils/redis.ts, functions/src/payments/
      # generatePaymentLink.ts). Runs unconditionally: exactly one of the two
      # steps above ran depending on `inputs.environment`, so functions/.env
      # exists here either way. Never echoes secret values or `cat`s the file.
      - name: Validate functions/.env — fail closed on missing required secrets
        run: |
          set -uo pipefail
          REQUIRED_KEYS="REDIS_URL PAYMENT_SERVER_URL INTERNAL_SECRET"
          MISSING=""
          for key in $REQUIRED_KEYS; do
            if ! grep -qE "^${key}=.+$" functions/.env; then
              MISSING="${MISSING} ${key}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::functions/.env is missing a value for:${MISSING} — refusing to deploy. A GitHub secret referenced by the 'Write functions .env' step above does not exist (or is empty) in this repo/environment; \`gh secret list --repo IsaacRomayVida/vidafinance\` shows what's actually provisioned."
            exit 1
          fi
          echo "All required functions/.env keys are present: ${REQUIRED_KEYS}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ inputs.environment == 'production' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Deploy Firebase (Staging)
        if: inputs.environment == 'staging'
        run: |
          firebase deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project ${{ secrets.FIREBASE_PROJECT_ID_STAGING }} \
            --non-interactive

      - name: Deploy Firebase (Production)
        if: inputs.environment == 'production'
        run: |
          firebase deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project ${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }} \
            --non-interactive
