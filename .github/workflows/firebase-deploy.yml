name: Deploy Firebase

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "services/**"
      - "*.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - run: cd functions && npm ci

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase credentials
        run: |
          printenv FIREBASE_SA > "$RUNNER_TEMP/firebase-sa.json"
          if [ ! -s "$RUNNER_TEMP/firebase-sa.json" ]; then
            echo "::error::firebase-sa.json is empty — check FIREBASE_SERVICE_ACCOUNT secret"
            exit 1
          fi
        env:
          FIREBASE_SA: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Write functions .env (Staging)
        if: github.ref == 'refs/heads/develop'
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL_STAGING }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL_STAGING }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL_STAGING }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL_STAGING }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL_STAGING }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL_STAGING }}
          ENVEOF

      - name: Write functions .env (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL_PRODUCTION }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL_PRODUCTION }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL_PRODUCTION }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL_PRODUCTION }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL_PRODUCTION }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL_PRODUCTION }}
          ENVEOF

      - name: Deploy Firebase (Staging)
        if: github.ref == 'refs/heads/develop'
        run: |
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project vida-finance \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Deploy Firebase (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project vida-finance \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
