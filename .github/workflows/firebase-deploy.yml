name: Deploy Firebase

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "services/**"
      - "*.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - run: cd functions && npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write functions .env (Staging)
        if: github.ref == 'refs/heads/develop'
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL_STAGING }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL_STAGING }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL_STAGING }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL_STAGING }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL_STAGING }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL_STAGING }}
          ENVEOF

      - name: Write functions .env (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          cat > functions/.env << ENVEOF
          REDIS_URL=${{ secrets.REDIS_URL_PRODUCTION }}
          CONEKTA_API_KEY=${{ secrets.CONEKTA_API_KEY }}
          INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
          SOFTCREDITO_ADAPTER_URL=${{ secrets.SOFTCREDITO_ADAPTER_URL_PRODUCTION }}
          PAYMENT_SERVER_URL=${{ secrets.PAYMENT_SERVER_URL_PRODUCTION }}
          NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL_PRODUCTION }}
          PDF_GENERATOR_URL=${{ secrets.PDF_GENERATOR_URL_PRODUCTION }}
          ML_SERVICE_URL=${{ secrets.ML_SERVICE_URL_PRODUCTION }}
          ENVEOF

      - name: Authenticate Firebase (Staging)
        if: github.ref == 'refs/heads/develop'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}" | base64 -d > /tmp/sa.json
          firebase deploy --only functions,hosting,firestore:rules,storage --project ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}

      - name: Authenticate Firebase (Production)
        if: github.ref == 'refs/heads/main'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}" | base64 -d > /tmp/sa.json
          firebase deploy --only functions,hosting,firestore:rules,storage --project ${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}
