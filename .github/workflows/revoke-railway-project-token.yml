name: Revoke a Railway project token

# A project token cannot revoke itself, and neither can the token of a
# different project: `projectTokens` answers "Not Authorized" to both. The only
# credential in this repo that can see the token list is the account-level
# `RAILWAY_API_TOKEN`, and it exists only as a GitHub secret — which is why
# revoking a token is a workflow rather than something run from a laptop.
#
# TEMPORARY. Added on 2026-09-18 to revoke
# `funpay-registry-local-isaac-mac-2026-09-17` in `vida-backend`, left behind
# by the registry move, and removed again immediately after. Anything that can
# delete a credential in any project the account token can see does not belong
# in the repo as a standing convenience.
#
# Manual only, names only: the API never returns a token's value, and this
# workflow prints only names and ids.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Railway project ID that holds the token"
        required: true
        type: string
      token_name:
        description: "Exact token name to revoke"
        required: true
        type: string
      confirm:
        description: 'Type REVOKE to confirm this deletes a credential'
        required: true
        type: string

jobs:
  revoke:
    name: Revoke the named project token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Refuse without the confirmation word
        if: inputs.confirm != 'REVOKE'
        run: |
          echo "::error::confirm must be exactly REVOKE — nothing was changed."
          exit 1

      - name: Revoke it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: ${{ inputs.project_id }}
          TOKEN_NAME: ${{ inputs.token_name }}
        run: |
          set -euo pipefail
          # No -x: the Authorization header must never reach the job log.
          api() {
            curl -sS https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$1"
          }

          list=$(api "$(jq -n --arg p "$PROJECT_ID" '{
            query: "query($p: String!) { projectTokens(projectId: $p, first: 100) { edges { node { id name createdAt } } } }",
            variables: { p: $p }
          }')")

          if echo "$list" | jq -e '.errors' >/dev/null; then
            echo "::error::Could not list tokens for $PROJECT_ID. $(echo "$list" | jq -c '[.errors[].message]')"
            exit 1
          fi

          echo "Tokens in $PROJECT_ID:"
          echo "$list" | jq -r '.data.projectTokens.edges[].node | "  \(.name)  (\(.id), created \(.createdAt))"'

          id=$(echo "$list" | jq -r --arg n "$TOKEN_NAME" \
            '.data.projectTokens.edges[].node | select(.name == $n) | .id' | head -1)

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::No token named '$TOKEN_NAME' in $PROJECT_ID — nothing was changed."
            exit 1
          fi

          out=$(api "$(jq -n --arg id "$id" '{
            query: "mutation($id: String!) { projectTokenDelete(id: $id) }",
            variables: { id: $id }
          }')")

          if echo "$out" | jq -e '.errors' >/dev/null; then
            echo "::error::Delete failed. $(echo "$out" | jq -c '[.errors[].message]')"
            exit 1
          fi

          # Prove it, rather than trusting the mutation's own answer.
          after=$(api "$(jq -n --arg p "$PROJECT_ID" '{
            query: "query($p: String!) { projectTokens(projectId: $p, first: 100) { edges { node { id name } } } }",
            variables: { p: $p }
          }')")

          if echo "$after" | jq -e --arg n "$TOKEN_NAME" \
            '.data.projectTokens.edges[].node | select(.name == $n)' >/dev/null; then
            echo "::error::'$TOKEN_NAME' is still listed after the delete."
            exit 1
          fi

          echo "✓ revoked '$TOKEN_NAME' ($id); it is no longer listed in $PROJECT_ID"
