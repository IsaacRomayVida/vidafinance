name: Deploy Railway Services

on:
  push:
    branches: [main]
    paths:
      - "services/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      payment-server: ${{ steps.changes.outputs.payment-server }}
      softcredito-adapter: ${{ steps.changes.outputs.softcredito-adapter }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      pdf-generator: ${{ steps.changes.outputs.pdf-generator }}
      ml-service: ${{ steps.changes.outputs.ml-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            payment-server:
              - "services/payment-server/**"
            softcredito-adapter:
              - "services/softcredito-adapter/**"
            notification-service:
              - "services/notification-service/**"
            pdf-generator:
              - "services/pdf-generator/**"
            ml-service:
              - "services/ml-service/**"

  deploy-payment-server:
    needs: detect
    if: needs.detect.outputs.payment-server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli
      - name: Deploy payment-server
        working-directory: services/payment-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --service payment-server --detach

  deploy-softcredito-adapter:
    needs: detect
    if: needs.detect.outputs.softcredito-adapter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli
      - name: Deploy softcredito-adapter
        working-directory: services/softcredito-adapter
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --service softcredito-adapter --detach

  deploy-notification-service:
    needs: detect
    if: needs.detect.outputs.notification-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli
      - name: Deploy notification-service
        working-directory: services/notification-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --service notification-service --detach

  deploy-pdf-generator:
    needs: detect
    if: needs.detect.outputs.pdf-generator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli
      - name: Deploy pdf-generator
        working-directory: services/pdf-generator
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --service pdf-generator --detach

  deploy-ml-service:
    needs: detect
    if: needs.detect.outputs.ml-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli
      - name: Deploy ml-service
        working-directory: services/ml-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --service ml-service --detach
