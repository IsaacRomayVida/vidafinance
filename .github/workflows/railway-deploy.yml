name: Deploy Railway Services

on:
  push:
    branches: [main]
    paths:
      - "services/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      payment-server: ${{ steps.changes.outputs.payment-server }}
      softcredito-adapter: ${{ steps.changes.outputs.softcredito-adapter }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      pdf-generator: ${{ steps.changes.outputs.pdf-generator }}
      ml-service: ${{ steps.changes.outputs.ml-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            payment-server:
              - "services/payment-server/**"
            softcredito-adapter:
              - "services/softcredito-adapter/**"
            notification-service:
              - "services/notification-service/**"
            pdf-generator:
              - "services/pdf-generator/**"
            ml-service:
              - "services/ml-service/**"

  deploy:
    needs: detect
    runs-on: ubuntu-latest
    if: |
      needs.detect.outputs.payment-server == 'true' ||
      needs.detect.outputs.softcredito-adapter == 'true' ||
      needs.detect.outputs.notification-service == 'true' ||
      needs.detect.outputs.pdf-generator == 'true' ||
      needs.detect.outputs.ml-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli
      - name: Deploy changed services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ "${{ needs.detect.outputs.payment-server }}" = "true" ]; then
            echo "Deploying payment-server..."
            railway redeploy --service "${{ secrets.RAILWAY_SERVICE_PAYMENT_SERVER }}" --yes
          fi
          if [ "${{ needs.detect.outputs.softcredito-adapter }}" = "true" ]; then
            echo "Deploying softcredito-adapter..."
            railway redeploy --service "${{ secrets.RAILWAY_SERVICE_SOFTCREDITO_ADAPTER }}" --yes
          fi
          if [ "${{ needs.detect.outputs.notification-service }}" = "true" ]; then
            echo "Deploying notification-service..."
            railway redeploy --service "${{ secrets.RAILWAY_SERVICE_NOTIFICATION_SERVICE }}" --yes
          fi
          if [ "${{ needs.detect.outputs.pdf-generator }}" = "true" ]; then
            echo "Deploying pdf-generator..."
            railway redeploy --service "${{ secrets.RAILWAY_SERVICE_PDF_GENERATOR }}" --yes
          fi
          if [ "${{ needs.detect.outputs.ml-service }}" = "true" ]; then
            echo "Deploying ml-service..."
            railway redeploy --service "${{ secrets.RAILWAY_SERVICE_ML_SERVICE }}" --yes
          fi

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to start
        run: sleep 30
      - name: Verify health endpoints
        env:
          PAYMENT_SERVER_URL: ${{ secrets.RAILWAY_URL_PAYMENT_SERVER }}
          NOTIFICATION_SERVICE_URL: ${{ secrets.RAILWAY_URL_NOTIFICATION_SERVICE }}
          PDF_GENERATOR_URL: ${{ secrets.RAILWAY_URL_PDF_GENERATOR }}
          SOFTCREDITO_ADAPTER_URL: ${{ secrets.RAILWAY_URL_SOFTCREDITO_ADAPTER }}
          ML_SERVICE_URL: ${{ secrets.RAILWAY_URL_ML_SERVICE }}
        run: |
          failed=0
          for pair in \
            "payment-server:$PAYMENT_SERVER_URL" \
            "notification-service:$NOTIFICATION_SERVICE_URL" \
            "pdf-generator:$PDF_GENERATOR_URL" \
            "softcredito-adapter:$SOFTCREDITO_ADAPTER_URL" \
            "ml-service:$ML_SERVICE_URL"; do
            name="${pair%%:*}"
            url="${pair#*:}"
            if [ -z "$url" ]; then
              echo "⚠ Skipping $name (no URL configured)"
              continue
            fi
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url/health" || true)
            if [ "$status" = "200" ]; then
              echo "✓ $name healthy (HTTP $status)"
            else
              echo "✗ $name unhealthy (HTTP $status)"
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "One or more services failed health check"
            exit 1
          fi
