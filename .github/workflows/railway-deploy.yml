name: Deploy Railway Services

on:
  push:
    branches: [main, develop]
    paths:
      - "services/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (leave empty to deploy all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - payment-server
          - softcredito-adapter
          - notification-service
          - pdf-generator
          - ml-service
          - underwriting-service
      environment:
        description: "Target environment"
        required: false
        default: "staging"
        type: choice
        options:
          - staging

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      payment-server: ${{ steps.changes.outputs.payment-server || steps.manual.outputs.payment-server }}
      softcredito-adapter: ${{ steps.changes.outputs.softcredito-adapter || steps.manual.outputs.softcredito-adapter }}
      notification-service: ${{ steps.changes.outputs.notification-service || steps.manual.outputs.notification-service }}
      pdf-generator: ${{ steps.changes.outputs.pdf-generator || steps.manual.outputs.pdf-generator }}
      ml-service: ${{ steps.changes.outputs.ml-service || steps.manual.outputs.ml-service }}
      underwriting-service: ${{ steps.changes.outputs.underwriting-service || steps.manual.outputs.underwriting-service }}
    steps:
      - uses: actions/checkout@v4

      # On push: detect which services changed
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            payment-server:
              - "services/payment-server/**"
            softcredito-adapter:
              - "services/softcredito-adapter/**"
            notification-service:
              - "services/notification-service/**"
            pdf-generator:
              - "services/pdf-generator/**"
            ml-service:
              - "services/ml-service/**"
            underwriting-service:
              - "services/underwriting-service/**"

      # On manual dispatch: mark selected service(s) for deploy
      - name: Resolve manual dispatch targets
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ github.event.inputs.service }}"
          if [ "$svc" = "all" ]; then
            echo "payment-server=true"        >> "$GITHUB_OUTPUT"
            echo "softcredito-adapter=true"   >> "$GITHUB_OUTPUT"
            echo "notification-service=true"  >> "$GITHUB_OUTPUT"
            echo "pdf-generator=true"         >> "$GITHUB_OUTPUT"
            echo "ml-service=true"            >> "$GITHUB_OUTPUT"
            echo "underwriting-service=true"  >> "$GITHUB_OUTPUT"
          else
            echo "payment-server=$( [ '$svc' = 'payment-server' ] && echo true || echo false )"              >> "$GITHUB_OUTPUT"
            echo "softcredito-adapter=$( [ '$svc' = 'softcredito-adapter' ] && echo true || echo false )"    >> "$GITHUB_OUTPUT"
            echo "notification-service=$( [ '$svc' = 'notification-service' ] && echo true || echo false )"  >> "$GITHUB_OUTPUT"
            echo "pdf-generator=$( [ '$svc' = 'pdf-generator' ] && echo true || echo false )"                >> "$GITHUB_OUTPUT"
            echo "ml-service=$( [ '$svc' = 'ml-service' ] && echo true || echo false )"                      >> "$GITHUB_OUTPUT"
            echo "underwriting-service=$( [ '$svc' = 'underwriting-service' ] && echo true || echo false )"  >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    runs-on: ubuntu-latest
    if: |
      needs.detect.outputs.payment-server == 'true' ||
      needs.detect.outputs.softcredito-adapter == 'true' ||
      needs.detect.outputs.notification-service == 'true' ||
      needs.detect.outputs.pdf-generator == 'true' ||
      needs.detect.outputs.ml-service == 'true' ||
      needs.detect.outputs.underwriting-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g @railway/cli

      - name: Resolve Railway token
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            TOKEN="${{ secrets.RAILWAY_TOKEN }}"
          else
            TOKEN="${{ secrets.RAILWAY_TOKEN_STAGING }}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "❌ Railway token secret not set for branch ${{ github.ref_name }}."
            exit 1
          fi
          echo "RAILWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy changed services
        run: |
          deploy_service() {
            local svc_flag="$1"
            local svc_name="$2"
            if [ "$svc_flag" = "true" ]; then
              echo "🚀 Deploying $svc_name..."
              railway redeploy --service "$svc_name" --yes || \
              echo "⚠️  redeploy failed for $svc_name (service may not exist with that name)"
            fi
          }
          deploy_service "${{ needs.detect.outputs.payment-server }}"      "vida-payment-server"
          deploy_service "${{ needs.detect.outputs.softcredito-adapter }}" "vida-softcredito"
          deploy_service "${{ needs.detect.outputs.notification-service }}" "vida-notifications"
          deploy_service "${{ needs.detect.outputs.pdf-generator }}"       "vida-pdf-generator"
          deploy_service "${{ needs.detect.outputs.ml-service }}"          "vida-ml-service"
          deploy_service "${{ needs.detect.outputs.underwriting-service }}" "vida-underwriting"

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to start
        run: sleep 60

      - name: Verify health endpoints
        id: health
        run: |
          ALL_OK=true
          check_health() {
            local url="$1"
            local service="$2"
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "✅ $service — healthy (HTTP $status)"
                return 0
              fi
              echo "  attempt $attempt/$max_attempts: $service returned $status, retrying in 15s..."
              sleep 15
              attempt=$((attempt + 1))
            done
            echo "❌ $service — not healthy after $max_attempts attempts (last: $status)"
            ALL_OK=false
            return 1
          }

          check_health "https://vida-payment-server.railway.app/health"  "payment-server"     || true
          check_health "https://vida-softcredito.railway.app/health"     "softcredito-adapter" || true
          check_health "https://vida-notifications.railway.app/health"   "notification-service" || true
          check_health "https://vida-pdf-generator.railway.app/health"   "pdf-generator"      || true
          check_health "https://vida-ml-service.railway.app/health"      "ml-service"         || true
          check_health "https://vida-underwriting.railway.app/health"   "underwriting-service" || true

          if [ "$ALL_OK" = "false" ]; then
            echo ""
            echo "⚠️  One or more services did not pass health checks."
            echo "Check Railway logs: railway logs --service <name>"
            # Non-blocking: don't fail the workflow — Railway may still be building
          else
            echo ""
            echo "🎉 All services are healthy!"
          fi
