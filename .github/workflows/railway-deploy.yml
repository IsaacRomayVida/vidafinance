name: Deploy Railway Services

on:
  push:
    branches: [main, develop]
    paths:
      - "services/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      payment-server: ${{ steps.changes.outputs.payment-server }}
      softcredito-adapter: ${{ steps.changes.outputs.softcredito-adapter }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      pdf-generator: ${{ steps.changes.outputs.pdf-generator }}
      ml-service: ${{ steps.changes.outputs.ml-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            payment-server:
              - "services/payment-server/**"
            softcredito-adapter:
              - "services/softcredito-adapter/**"
            notification-service:
              - "services/notification-service/**"
            pdf-generator:
              - "services/pdf-generator/**"
            ml-service:
              - "services/ml-service/**"

  deploy:
    needs: detect
    runs-on: ubuntu-latest
    if: |
      needs.detect.outputs.payment-server == 'true' ||
      needs.detect.outputs.softcredito-adapter == 'true' ||
      needs.detect.outputs.notification-service == 'true' ||
      needs.detect.outputs.pdf-generator == 'true' ||
      needs.detect.outputs.ml-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @railway/cli
      - name: Deploy changed services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ "${{ needs.detect.outputs.payment-server }}" = "true" ]; then
            railway redeploy --service vida-payment-server --yes
          fi
          if [ "${{ needs.detect.outputs.softcredito-adapter }}" = "true" ]; then
            railway redeploy --service vida-softcredito --yes
          fi
          if [ "${{ needs.detect.outputs.notification-service }}" = "true" ]; then
            railway redeploy --service vida-notifications --yes
          fi
          if [ "${{ needs.detect.outputs.pdf-generator }}" = "true" ]; then
            railway redeploy --service vida-pdf-generator --yes
          fi
          if [ "${{ needs.detect.outputs.ml-service }}" = "true" ]; then
            railway redeploy --service vida-ml-service --yes
          fi

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to start
        run: sleep 30
      - name: Verify health endpoints
        run: |
          check_health() {
            local url="$1"
            local service="$2"
            local status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ $service is healthy ($status)"
            else
              echo "⚠️  $service returned $status (may still be starting)"
            fi
          }
          check_health "https://vida-payment-server.railway.app/health" "payment-server"
          check_health "https://vida-softcredito.railway.app/health" "softcredito-adapter"
          check_health "https://vida-notifications.railway.app/health" "notification-service"
          check_health "https://vida-pdf-generator.railway.app/health" "pdf-generator"
          check_health "https://vida-ml-service.railway.app/health" "ml-service"
