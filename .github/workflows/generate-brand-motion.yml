name: Generate brand motion (fal.ai)

# On-demand: generates the Seedance ambient brand loop with the FAL_AI repo
# secret and uploads it as an artifact for review — nothing is committed.
# See mobile/scripts/generate-brand-motion.mjs.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Asset kind"
        required: true
        default: "motion"
        type: choice
        options:
          - motion
          - splash
      prompt:
        description: "Override the default brand prompt"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate
        env:
          FAL_KEY: ${{ secrets.FAL_AI }}
        run: |
          SCRIPT="mobile/scripts/generate-brand-motion.mjs"
          if [ "${{ github.event.inputs.kind }}" = "splash" ]; then
            SCRIPT="mobile/scripts/generate-brand-splash.mjs"
          fi
          if [ -n "${{ github.event.inputs.prompt }}" ]; then
            node "$SCRIPT" --prompt "${{ github.event.inputs.prompt }}"
          else
            node "$SCRIPT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: brand-asset
          path: |
            mobile/assets/brand-loop.mp4
            mobile/assets/splash-generated.png
          retention-days: 7
          if-no-files-found: ignore
