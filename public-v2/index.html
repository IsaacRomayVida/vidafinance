  <!-- Fonts are served from this origin (public/fonts, SIL OFL 1.1 — see
       public/fonts/README.md) and the two latin files are preloaded, so the
       text paints in Urbanist / Doto on the first frame: no third-party
       connection, and no fallback-to-webfont swap moving the headline (CLS).
       The faces mirror what Google Fonts served for
       Urbanist:wght@300;400;500;600;700 and Doto:wght@400;600;700. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/urbanist-latin-wght-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/doto-latin-wght-normal.woff2" crossorigin />
  <style>
    @font-face{font-family:'Urbanist';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/urbanist-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Funpay</title>
  <!-- LCP: the hero poster of a landing page is requested from the HTML,
       not after the app bundle has run. Same stills and 860px breakpoint as
       HeroSection / EmployerPage / EmployeePage + PhotoHero
       (src/perf/deliveryContract.test.ts keeps them in sync). Launch-mode builds only. -->
  <script>
    (function () {
      if ('%VITE_LAUNCH_MODE%' !== 'live') return;
      var heroes = { '': 'hero-dawn', employers: 'employer-hero', employees: 'employee-hero' };
      var base = '%BASE_URL%';
      var page = location.pathname.slice(base.length).replace(/\/$/, '');
      if (!Object.prototype.hasOwnProperty.call(heroes, page)) return;
      var name = heroes[page];
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.fetchPriority = 'high';
      link.href = base + 'images/brand/' + name + (matchMedia('(max-width: 860px)').matches ? '-9x16' : '-16x9') + '.webp';
      document.head.appendChild(link);
    })();
  </script>
</head>
